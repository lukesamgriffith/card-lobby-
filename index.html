<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e3b2b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Card Lobby" />
  <title>Card Lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }
html, body, #app { height: 100%; }
html { touch-action: pan-x pan-y; }
body { font-family: 'Outfit', system-ui, sans-serif; color: #f3ead4;
  background: radial-gradient(120% 90% at 50% -10%, #16523c 0%, #0e3b2b 45%, #08291e 100%); }
body::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px); background-size:4px 4px; }

/* home */
.home { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; }
.home-inner { width:100%; max-width:380px; text-align:center; }
.suits { letter-spacing:.5em; color:#d9b35c; font-size:18px; margin-bottom:14px; opacity:.85; }
.title { font-family:'Fraunces',serif; font-weight:700; font-size:46px; line-height:1; margin-bottom:10px;
  background:linear-gradient(180deg,#fff5dd,#d9b35c); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { color:#bcd6c6; font-size:14.5px; line-height:1.5; margin-bottom:26px; }
.label { display:block; text-align:left; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8fb6a1; margin:16px 2px 7px; }
.input { width:100%; padding:14px 16px; border-radius:13px; border:1px solid rgba(217,179,92,.28);
  background:rgba(0,0,0,.22); color:#fff; font-size:16px; font-family:inherit; outline:none; }
.input:focus { border-color:#d9b35c; }
.code-in { letter-spacing:.35em; text-align:center; font-weight:600; font-size:20px; }
.btn { width:100%; padding:15px; border-radius:13px; font-family:inherit; font-size:15.5px; font-weight:600;
  border:none; cursor:pointer; margin-top:12px; transition:transform .08s; }
.btn:active { transform:scale(.985); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.primary { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; box-shadow:0 6px 18px rgba(0,0,0,.3); }
.btn.outline { background:transparent; color:#f3ead4; border:1px solid rgba(243,234,212,.28); }
.btn.ghost { background:transparent; color:#9fc0ad; }
.err { margin-top:14px; color:#ffb4ab; font-size:13.5px; }
.foot { margin-top:24px; color:#6f9381; font-size:12px; line-height:1.5; }

/* table */
.table { min-height:100vh; display:flex; flex-direction:column; }
.top { display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top)) 16px 8px; }
.codebox { display:flex; flex-direction:column; line-height:1; cursor:pointer; }
.codelabel { font-size:9.5px; letter-spacing:.18em; color:#7fa691; }
.codeval { font-family:'Fraunces',serif; font-weight:700; font-size:27px; letter-spacing:.16em; color:#fff5dd; margin-top:3px; }
.copy { font-size:10px; color:#5f8472; margin-top:3px; }
.iconbtn { background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.1); color:#f3ead4; width:40px; height:40px; border-radius:11px; font-size:20px; cursor:pointer; }
.players { display:flex; gap:8px; padding:4px 16px 10px; flex-wrap:wrap; }
.waiting { color:#7fa691; font-size:13px; padding:4px 2px; }
.pchip { display:flex; align-items:center; gap:7px; background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.09); border-radius:20px; padding:7px 12px; color:#eadfc4; font-size:13px; font-family:inherit; cursor:pointer; }
.pchip.away { opacity:.45; }
.pchip.away .pdot { background:#8a8a8a; box-shadow:none; }
.pdot { width:7px; height:7px; border-radius:50%; background:#6fd39a; box-shadow:0 0 6px #6fd39a; }
.pname { font-weight:600; } .pcount { color:#bca; font-size:12px; }
.felt { flex:1; display:flex; flex-direction:column; padding:8px 12px; }
.deck { position:absolute; top:12px; left:12px; z-index:1000; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.deckstack { width:56px; height:80px; border-radius:8px; position:relative;
  background:var(--cd-back-bg,repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 6px,#8c2727 6px,#8c2727 12px));
  border:2px solid var(--cd-back-border,#e6c068); box-shadow:0 3px 0 rgba(0,0,0,.32),0 7px 0 rgba(0,0,0,.26),0 12px 18px rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; }
.deckstack::after { content:''; position:absolute; inset:6px; border:1px solid rgba(255,255,255,.3); border-radius:5px; }
.deckcount { font-family:'Fraunces',serif; font-weight:700; font-size:18px; color:#fff5dd; z-index:1; background:rgba(0,0,0,.42); padding:1px 9px; border-radius:11px; }
.decklabel { font-size:9px; letter-spacing:.16em; color:#9fc0ad; }
.deck.shuf .deckstack { animation:shuf .55s ease; }
@keyframes shuf { 0%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-7px) rotate(-4deg)} 55%{transform:translateX(7px) rotate(4deg)} 80%{transform:translateX(-3px) rotate(-1deg)} 100%{transform:none} }
.tablearea { position:relative; width:100%; flex:1; min-height:52vh; padding:14px; border-radius:18px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%, rgba(0,0,0,.16), rgba(0,0,0,.28)); border:1px solid rgba(255,255,255,.06); box-shadow:inset 0 2px 14px rgba(0,0,0,.35); }
.tablecard { position:absolute; width:62px; height:88px; transform:translate(-50%,-50%); cursor:grab; touch-action:none; border-radius:7px; transition:box-shadow .12s, transform .06s; }
.tablecard .face, .tablecard .back { width:100%; height:100%; }
.tablecard.dragging { cursor:grabbing; transition:none; transform:translate(-50%,-50%) scale(1.06); box-shadow:0 16px 30px rgba(0,0,0,.55); }
.tablecard.peeking { box-shadow:0 0 0 2px #d9b35c, 0 10px 18px rgba(0,0,0,.45); }
.emptytable, .emptyhand { color:#6f9381; font-size:13px; align-self:center; margin:auto; }

/* cards */
.card { padding:0; border:none; background:none; cursor:pointer; border-radius:7px; transition:transform .12s; position:relative; display:inline-block; }
.card:active { transform:translateY(-3px) scale(1.02); }
.card.peeking { transform:translateY(-6px); box-shadow:0 0 0 2px #d9b35c,0 10px 18px rgba(0,0,0,.45); }
.face, .back { width:100%; height:100%; border-radius:var(--cd-radius,7px); position:relative; }
.face { background:var(--cd-face-bg,linear-gradient(170deg,#fbf7ec,#efe7d2)); border:1px solid var(--cd-face-border,#cbb98e); box-shadow:var(--cd-shadow,0 3px 8px rgba(0,0,0,.35)); }
.face.red { color:var(--cd-red,#b3261e); }
.face.black { color:var(--cd-black,#1a1a1a); }
.back { background:var(--cd-back-bg,repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 5px,#8c2727 5px,#8c2727 10px)); border:2px solid var(--cd-back-border,#e6c068); box-shadow:var(--cd-shadow,0 3px 8px rgba(0,0,0,.4)); }
.back::after { content:''; position:absolute; inset:5px; border:1px solid rgba(255,255,255,.28); border-radius:4px; }
.corner { position:absolute; display:flex; flex-direction:column; align-items:center; line-height:.95; font-weight:700; font-family:var(--cd-font,'Fraunces',serif); }
.corner .r { font-size:14px; } .corner .s { font-size:11px; }
.corner.tl { top:5px; left:6px; } .corner.br { bottom:5px; right:6px; transform:rotate(180deg); }
.pip { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; }
@supports (container-type: inline-size) {
  .face { container-type: inline-size; }
  .corner .r { font-size:21cqw; } .corner .s { font-size:16cqw; }
  .corner.tl { top:7cqw; left:8cqw; } .corner.br { bottom:7cqw; right:8cqw; }
  .pip { font-size:38cqw; }
}
.eye { position:absolute; top:-9px; right:-7px; font-size:14px; background:#0e3b2b; border:1px solid #d9b35c; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }

/* hand */
.hand { background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.4)); border-top:1px solid rgba(217,179,92,.25); padding:12px 14px 18px; }
.handlabel { font-size:11px; letter-spacing:.13em; color:#9fc0ad; margin-bottom:9px; }
.handlabel span { text-transform:none; letter-spacing:0; color:#6f9381; font-size:11px; }
.handcards { display:flex; justify-content:center; align-items:center; min-height:142px; padding:6px 8px 8px; overflow:hidden; }
.handcard { flex:0 0 auto; width:86px; height:124px; padding:0; border:none; background:none; border-radius:8px; cursor:grab; touch-action:none; position:relative; transition:transform .08s; }
.handcard .face, .handcard .back { width:100%; height:100%; box-shadow:0 2px 7px rgba(0,0,0,.45); }
.handcard.dragging { cursor:grabbing; transition:none; z-index:20; box-shadow:0 16px 28px rgba(0,0,0,.55); }
.countrow { display:flex; gap:8px; margin:0 4px 12px; }
.countbtn { flex:1; padding:13px 0; border-radius:11px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#f3ead4; font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; }
.countbtn.on { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; border-color:#e6c068; }

/* poker mode */
.pokerplayers { display:flex; gap:8px; padding:4px 12px 8px; flex-wrap:wrap; }
.pseat { background:rgba(0,0,0,.26); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:7px 10px; min-width:96px; }
.pseat.turn { border-color:#e6c068; box-shadow:0 0 0 1px #e6c068, 0 0 12px rgba(230,192,104,.35); }
.pseat.folded { opacity:.45; }
.pseat-top { display:flex; align-items:center; gap:5px; margin-bottom:3px; }
.pn { font-size:13px; font-weight:600; color:#eadfc4; }
.badge { font-size:9px; font-weight:700; padding:1px 5px; border-radius:6px; background:rgba(255,255,255,.12); color:#f3ead4; letter-spacing:.04em; }
.badge.btn { background:#e6c068; color:#3a2a06; }
.pchips { font-size:13px; color:#fff5dd; font-weight:600; }
.pbet { font-size:11px; color:#d9b35c; margin-top:2px; }
.pstatus { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9fc0ad; margin-top:2px; }
.pokerfelt { gap:12px; align-items:center; justify-content:flex-start; }
.pokerinfo { font-size:13px; color:#cfe3d6; margin-top:6px; }
.pokerinfo b { color:#fff5dd; letter-spacing:.08em; }
.board { display:flex; gap:7px; justify-content:center; min-height:74px; align-items:center; margin-top:6px; }
.bcard { width:50px; height:70px; }
.bcard .face, .bcard .back { width:100%; height:100%; }
.bslot { width:50px; height:70px; border-radius:6px; border:1px dashed rgba(255,255,255,.14); }
.pcenter { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:8px; text-align:center; }
.result { font-family:'Fraunces',serif; font-size:18px; color:#fff5dd; }
.showns { font-size:12px; color:#9fc0ad; }
.hint { font-size:13px; color:#8fb6a1; }
.pokerhand { display:flex; flex-direction:column; gap:10px; align-items:center; }
.holecards { display:flex; gap:8px; align-items:center; min-height:96px; }
.holecard { width:68px; height:96px; }
.holecard .face, .holecard .back { width:100%; height:100%; }
.foldedtag { font-size:12px; color:#ffb4ab; align-self:center; }
.actionbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; width:100%; }
.actionbar.idle { min-height:0; }
.pbtn { padding:12px 14px; border-radius:11px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); color:#f3ead4; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.pbtn.fold { color:#ffb4ab; }
.pbtn.call { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; border-color:#e6c068; }
.pbtn.allin { color:#ffd9a0; }
.pbtn.add { background:transparent; color:#9fc0ad; border-color:rgba(159,192,173,.4); }
.actrow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; width:100%; }
.raisebox { width:100%; max-width:420px; background:rgba(0,0,0,.28); border:1px solid rgba(217,179,92,.25); border-radius:14px; padding:11px 13px; display:flex; flex-direction:column; gap:9px; }
.rtop { display:flex; justify-content:space-between; align-items:baseline; }
.rlabel { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#9fc0ad; }
.ramt { font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:#fff5dd; }
.rslider { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px; background:linear-gradient(90deg,#cf9f3f,#e6c068); outline:none; margin:2px 0; }
.rslider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:#fff5dd; border:2px solid #cf9f3f; box-shadow:0 1px 4px rgba(0,0,0,.4); cursor:pointer; }
.rslider::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:#fff5dd; border:2px solid #cf9f3f; cursor:pointer; }
.rpresets { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.rpreset { flex:1; min-width:54px; padding:9px 6px; border-radius:9px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#f3ead4; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.pbtn.raise { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; border-color:#e6c068; flex:1.4; min-width:120px; }

/* showdown reveal */
.pcenter.showdown { width:100%; }
.showlist { display:flex; flex-direction:column; gap:7px; width:100%; max-width:380px; }
.showrow { display:flex; align-items:center; gap:9px; background:rgba(0,0,0,.22); border-radius:10px; padding:6px 10px; animation:rise .25s ease; }
.sn { font-weight:600; color:#fff5dd; flex:1; text-align:left; font-size:13.5px; }
.scards { display:flex; gap:5px; }
.mini { display:inline-flex; align-items:center; gap:2px; background:var(--cd-face-bg,linear-gradient(170deg,#fbf7ec,#efe7d2)); border:1px solid var(--cd-face-border,#cbb98e); border-radius:6px; padding:3px 7px; font-family:var(--cd-font,'Fraunces',serif); font-weight:700; }
.mini.red { color:var(--cd-red,#b3261e); }
.mini.black { color:var(--cd-black,#1a1a1a); }
.mini .mr { font-size:16px; line-height:1; }
.mini .ms { font-size:13px; line-height:1; }

/* game picker + how-to + theme picker */
.gamecat { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#7fae93; margin:14px 4px 7px; font-weight:600; }
.gamerow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.grow-main { display:flex; flex-direction:column; gap:2px; text-align:left; }
.gname { font-size:15.5px; color:#f3ead4; }
.gmeta { font-size:12px; color:#9fc0ad; }
.tag { font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; }
.tag.ready { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; }
.tag.soon { background:rgba(255,255,255,.08); color:#9fc0ad; border:1px solid rgba(159,192,173,.3); }
.gmeta2 { font-size:12.5px; color:#9fc0ad; margin:-6px 4px 12px; }
.rules { margin:0 0 14px; padding:0 0 0 22px; display:flex; flex-direction:column; gap:7px; }
.rules li { color:#e7dcc2; font-size:14px; line-height:1.4; }
.row.disabled { opacity:.6; text-align:center; cursor:default; }
.soonnote { text-align:center; color:#e6c068; font-weight:600; padding:13px; background:rgba(230,192,104,.08); border:1px solid rgba(230,192,104,.25); border-radius:13px; margin-bottom:9px; }
.themegrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.themeopt { display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 6px; border-radius:13px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); cursor:pointer; }
.themeopt.on { border-color:#e6c068; background:rgba(230,192,104,.12); }
.swatch { position:relative; width:54px; height:46px; }
.sw-back { position:absolute; left:2px; top:3px; width:32px; height:44px; border-radius:6px; border:2px solid; transform:rotate(-9deg); }
.sw-face { position:absolute; right:2px; top:0; width:32px; height:44px; border-radius:6px; border:1px solid; transform:rotate(8deg); display:flex; align-items:center; justify-content:center; gap:1px; font-weight:700; font-size:14px; }
.themename { font-size:12.5px; color:#f3ead4; }

/* coming-soon screen */
.soonfelt { align-items:center; justify-content:center; }
.sooncard { max-width:420px; width:100%; text-align:center; background:rgba(0,0,0,.2); border:1px solid rgba(217,179,92,.25); border-radius:18px; padding:22px 18px; }
.suits.small { font-size:20px; letter-spacing:.18em; color:#d9b35c; }
.soontitle { font-family:'Fraunces',serif; font-size:24px; color:#fff5dd; margin:8px 0 2px; }
.soonmsg { color:#cde0d4; font-size:14px; margin:12px 0 14px; }
.sooncard .rules { text-align:left; }
.shand { font-size:12px; color:#9fc0ad; min-width:96px; text-align:right; }

/* sheet / toast */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:9000; }
.sheet { width:100%; max-width:440px; max-height:86vh; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; background:#0e3b2b; border:1px solid rgba(217,179,92,.3); border-bottom:none; border-radius:20px 20px 0 0;
  padding:0 16px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.5); animation:rise .2s ease; }
.sheethead { position:sticky; top:0; z-index:3; display:flex; justify-content:flex-end; align-items:center; background:#0e3b2b; margin:0 -16px 2px; padding:10px 12px 6px; border-radius:20px 20px 0 0; }
.sheetclose { width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#f3ead4; font-size:15px; line-height:1; cursor:pointer; }
@keyframes rise { from{transform:translateY(30px)} to{transform:none} }
.sheettitle { font-family:'Fraunces',serif; font-size:18px; margin:0 4px 14px; color:#fff5dd; }
.row { display:block; width:100%; text-align:left; padding:15px 16px; border-radius:13px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); color:#f3ead4; font-family:inherit; font-size:15.5px; cursor:pointer; margin-bottom:9px; }
.row.danger { color:#ffb4ab; }
.toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:9500; background:rgba(8,41,30,.95); border:1px solid #d9b35c; color:#fff5dd; padding:10px 18px; border-radius:30px; font-size:13.5px; }

/* ---------- Go Fish ---------- */
.gfstats { font-size:13px; color:#cde0d4; margin-top:2px; }
.bookranks { font-family:'Fraunces',serif; font-size:12px; color:#e6c068; margin-top:3px; letter-spacing:.04em; }
.gflog { display:flex; flex-direction:column; gap:5px; width:100%; max-width:420px; margin-top:8px; }
.logline { font-size:13px; color:#cde0d4; background:rgba(0,0,0,.2); border-radius:9px; padding:6px 11px; animation:rise .25s ease; }
.gfhand { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; padding:4px 0; }
.gfcard { width:52px; height:74px; transition:transform .12s ease, box-shadow .12s ease; }
.gfcard[data-gfpick] { cursor:pointer; }
.gfcard.sel { transform:translateY(-10px); box-shadow:0 10px 20px rgba(0,0,0,.5); outline:3px solid #e6c068; outline-offset:1px; border-radius:9px; }
.gfcard .face, .gfcard .back { width:100%; height:100%; }
.gfbeat { font-size:15px; color:#fff5dd; text-align:center; background:rgba(0,0,0,.28); border:1px solid rgba(230,192,104,.35); border-radius:12px; padding:11px 14px; animation:rise .25s ease; }
.gfaction { width:100%; display:flex; flex-direction:column; align-items:center; gap:9px; margin-top:6px; }
.gfaction.idle { min-height:0; }
.gflabel { font-size:13px; color:#cde0d4; text-align:center; }
.rankrow { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }

/* =====================================================================

  background:linear-gradient(180deg,var(--brass1) 0%,var(--brass2) 46%,var(--brass3) 100%);

  box-shadow:inset 0 1px 0 var(--brass-edge), inset 0 -2px 5px rgba(0,0,0,.22), 0 4px 13px rgba(0,0,0,.34);
  text-shadow:0 1px 0 rgba(255,248,224,.3);
}

.btn.outline { border-color:var(--surface-line); color:var(--ink); }

/* ---- home ---- */
.title { background:linear-gradient(180deg,var(--brass1),var(--brass2)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  box-shadow:inset 0 1px 0 var(--surface-hi); }

.scrim { background:rgba(4,16,11,.62); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.sheet { background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--rail); border-bottom:none;
