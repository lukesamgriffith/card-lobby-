        ${others.map((p) => `<button class="pchip${p.away ? " away" : ""}" data-act="player" data-id="${p.id}"><span class="pdot"></span><span class="pname">${esc(p.name)}</span><span class="pcount">\uD83C\uDCA0 ${p.count}</span></button>`).join("")}
      </div>
      <div class="felt">
        <div class="tablearea">
          <div class="deck${shuf ? " shuf" : ""}" id="deck"><div class="deckstack"><span class="deckcount">${state.deckCount}</span></div><span class="decklabel">DECK</span></div>
          ${state.table.length === 0 ? '<div class="emptytable">Dealt cards land here \u00b7 drag to arrange</div>' : ""}
          ${state.table.map((c) => {
            const show = c.faceUp || c.peekedByMe;
            const eye = !c.peekedByMe && c.peekedByName ? `<div class="eye" title="${esc(c.peekedByName)} is peeking">\uD83D\uDC41</div>` : "";
            const x = c.x != null ? c.x : 0.5, y = c.y != null ? c.y : 0.45;
            return `<div class="tablecard${c.peekedByMe ? " peeking" : ""}" data-id="${c.id}" style="left:${x * 100}%;top:${y * 100}%;z-index:${c.z || 1}">${cardInner(c.code || "", show)}${eye}</div>`;
          }).join("")}
        </div>
      </div>
      <div class="hand">
        <div class="handlabel">YOUR HAND <span>${mine.count} cards \u00b7 only you can see these \u00b7 drag to reorder</span></div>
        <div class="handcards">
          ${state.myHand.length === 0 ? '<div class="emptyhand">No cards yet \u2014 tap the deck to deal</div>' : ""}
          ${state.myHand.map((code) => `<button class="handcard" data-code="${code}">${cardInner(code, true)}</button>`).join("")}
        </div>
      </div>
    </div>`;
    shuf = false;

    document.getElementById("codebox").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
    document.getElementById("menu").onclick = () => { sheet = { kind: "menu" }; renderSheet(); };
    document.getElementById("deck").onclick = () => { sheet = { kind: "deck" }; renderSheet(); };
    app.querySelectorAll("[data-act]").forEach((el) => {
      el.onclick = () => {
        const act = el.dataset.act;
        if (act === "player") sheet = { kind: "player", pid: el.dataset.id };
        else return;
        renderSheet();
      };
    });
    const area = app.querySelector(".tablearea");
    app.querySelectorAll(".tablecard").forEach((el) => attachTableCard(el, el.dataset.id, area));
    const hc = app.querySelector(".handcards");
    app.querySelectorAll(".handcard").forEach((el) => attachHandCard(el, el.dataset.code, hc));
    layoutHand();
  }

  /* fan the hand so every card stays visible (overlap when there are too many to lay flat) */
  function layoutHand() {
    const wrap = app.querySelector(".handcards");
    if (!wrap) return;
    const cards = Array.from(wrap.querySelectorAll(".handcard"));
    if (!cards.length) return;
    const cw = 86, gap = 10;
    const avail = Math.max(200, wrap.clientWidth - 12);
    const n = cards.length;
    const step = (n * cw + (n - 1) * gap <= avail) ? cw + gap : Math.max(24, (avail - cw) / (n - 1));
    cards.forEach((c, i) => { c.style.marginLeft = i === 0 ? "0px" : (step - cw) + "px"; c.style.zIndex = String(i + 1); });
  }

  /* drag-to-position for a table card; a tap (no real movement) opens its menu */
  function attachTableCard(el, id, area) {
    let down = false, moved = false, lastX = 0, lastY = 0, last = 0;
    el.addEventListener("pointerdown", (e) => {
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      down = true; moved = false;
      el._sx = e.clientX; el._sy = e.clientY;
    });
    el.addEventListener("pointermove", (e) => {
      if (!down) return;
      if (!moved && Math.hypot(e.clientX - el._sx, e.clientY - el._sy) < 6) return;
      moved = true; dragging = true;
      el.classList.add("dragging"); el.style.zIndex = 9999;
      const r = area.getBoundingClientRect();
      lastX = Math.min(0.97, Math.max(0.03, (e.clientX - r.left) / r.width));
      lastY = Math.min(0.94, Math.max(0.06, (e.clientY - r.top) / r.height));
      el.style.left = lastX * 100 + "%"; el.style.top = lastY * 100 + "%";
      const now = Date.now();
      if (now - last > 70) { last = now; emit("dragMove", { id, x: lastX, y: lastY }); } // relay so others see it glide
    });
    const finish = (e) => {
      if (!down) return;
      down = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      if (moved) {
        emit("dropCard", { id, x: lastX, y: lastY });
        const c = state && state.table.find((t) => t.id === id);
        if (c) { c.x = lastX; c.y = lastY; } // optimistic, so it doesn't flicker before the broadcast
        dragging = false;
      } else {
        sheet = { kind: "table", card: state.table.find((t) => t.id === id) };
        renderSheet();
      }
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  /* drag a hand card: release over the table to PLAY it there (face up), or within the
     hand to REORDER. A quick tap opens its menu. The card floats so it can leave the hand strip. */
  function attachHandCard(el, code, container) {
    let down = false, moved = false, sx = 0, sy = 0, px = 0, py = 0, ghost = null;
    const lift = () => {
      const r = el.getBoundingClientRect();
      ghost = el.cloneNode(true);
      Object.assign(ghost.style, {
        position: "fixed", left: px + "px", top: py + "px", width: r.width + "px", height: r.height + "px",
        margin: "0", transform: "translate(-50%,-50%) scale(1.08)", pointerEvents: "none", zIndex: "99999",
        boxShadow: "0 18px 32px rgba(0,0,0,.6)", borderRadius: "8px",
      });
      document.body.appendChild(ghost);
      el.style.opacity = "0.25";
    };
    el.addEventListener("pointerdown", (e) => {
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      down = true; moved = false; sx = e.clientX; sy = e.clientY; px = e.clientX; py = e.clientY;
    });
    el.addEventListener("pointermove", (e) => {
      if (!down) return;
      px = e.clientX; py = e.clientY;
      if (!moved && Math.hypot(px - sx, py - sy) < 6) return;
      if (!moved) { moved = true; dragging = true; lift(); }
      if (ghost) { ghost.style.left = px + "px"; ghost.style.top = py + "px"; }
    });
    const finish = (e) => {
      if (!down) return; down = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      if (ghost) { ghost.remove(); ghost = null; }
      el.style.opacity = "";
      if (!moved) { sheet = { kind: "hand", code }; renderSheet(); return; }
      const area = document.querySelector(".tablearea");
      const tr = area ? area.getBoundingClientRect() : null;
      if (tr && px >= tr.left && px <= tr.right && py >= tr.top && py <= tr.bottom) {
        // dropped on the community table -> play it there, face up, where it landed
        const x = Math.min(0.97, Math.max(0.03, (px - tr.left) / tr.width));
        const y = Math.min(0.94, Math.max(0.06, (py - tr.top) / tr.height));
        const i = state.myHand.indexOf(code); if (i >= 0) state.myHand.splice(i, 1); // optimistic
        emit("playFromHand", { code, faceUp: true, x, y });
      } else {
        // released within the hand -> reorder to the drop position
        const cards = Array.from(container.querySelectorAll(".handcard"));
        let idx = 0;
        for (const k of cards) { if (k === el) continue; const r = k.getBoundingClientRect(); if (px > r.left + r.width / 2) idx++; }
        const order = state.myHand.slice();
        const from = order.indexOf(code);
        if (from >= 0) { order.splice(from, 1); order.splice(idx, 0, code); }
        state.myHand = order; // optimistic
        emit("reorderHand", { order });
      }
      dragging = false; render();
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  /* ---------------- poker mode UI ---------------- */
  function cardMini(code) {
    const r = code.slice(0, -1), s = code.slice(-1);
    const [sym] = SUIT[s];
    const rl = RLAB[r] || r;
    return `<span class="mini ${isRed(s) ? "red" : "black"}"><span class="mr">${rl}</span><span class="ms">${sym}</span></span>`;
  }
  function showHandsHtml(list) {
    return (list || []).map((s) => `<div class="showrow"><span class="sn">${esc(s.name)}</span><span class="scards">${(s.hole || []).map((c) => cardMini(c)).join("")}</span>${s.hand ? `<span class="shand">${s.hand}</span>` : ""}</div>`).join("");
  }
  function pokerCenter(pk) {
    if (pk.revealing) {
      const rows = showHandsHtml(pk.shown);
      const prompt = pk.myReveal ? '<div class="hint">Your turn \u2014 show or muck below</div>' : '<div class="hint">Showdown\u2026</div>';
      return `<div class="pcenter showdown"><div class="showlist">${rows}</div>${prompt}</div>`;
    }
    if (pk.results) {
      const r = pk.results;
      const win = r.winners.map((w) => esc(w.name) + " +" + w.amount + (w.hand ? " (" + w.hand + ")" : "")).join(", ");
      const shown = r.uncontested ? "" : showHandsHtml(r.shown);
      return `<div class="pcenter"><div class="result">\uD83C\uDFC6 ${win}</div>${shown ? `<div class="showlist">${shown}</div>` : ""}${pk.canStart ? '<button class="btn primary" id="deal">Deal next hand</button>' : '<div class="hint">Need 2+ players with chips</div>'}</div>`;
    }
    if (!pk.handLive) return `<div class="pcenter">${pk.canStart ? '<button class="btn primary" id="deal">Deal hand</button>' : '<div class="hint">Add chips, then deal \u2014 needs 2+ players</div>'}</div>`;
    const turn = (pk.players.find((p) => p.isTurn) || {}).name;
    return `<div class="pcenter"><div class="hint">${turn ? esc(turn) + " to act\u2026" : ""}</div></div>`;
  }
  function actionBar(pk) {
    const add = '<button class="pbtn add" id="addchips">\uFF0B Add chips</button>';
    if (pk.myReveal) {
      return `<div class="actionbar"><button class="pbtn call" id="showhand">Show hand</button><button class="pbtn fold" id="muck">Muck</button></div>`;
    }
    if (pk.myTurn && pk.legal) {
      const L = pk.legal;
      const callLabel = L.canCheck ? "Check" : (L.canCall ? "Call " + L.toCall : "Call");
      const canRaise = L.canRaise && L.maxRaiseTo >= L.minRaiseTo;
      const bb = pk.bb || 10;
      const slider = canRaise ? `
        <div class="raisebox">
          <div class="rtop"><span class="rlabel">Raise to</span><span class="ramt" id="ramt">${raiseTo}</span></div>
          <input type="range" class="rslider" id="rslider" min="${L.minRaiseTo}" max="${L.maxRaiseTo}" step="${bb}" value="${raiseTo}">
          <div class="rpresets">
            <button class="rpreset" data-rp="min">Min</button>
            <button class="rpreset" data-rp="half">\u00BD Pot</button>
            <button class="rpreset" data-rp="pot">Pot</button>
            <button class="rpreset" data-rp="max">Max</button>
            <button class="pbtn raise" id="raise">Raise to ${raiseTo}</button>
          </div>
        </div>` : "";
      return `<div class="actionbar">
        <div class="actrow">
          <button class="pbtn fold" id="fold">Fold</button>
          <button class="pbtn call" id="callcheck">${callLabel}</button>
          <button class="pbtn allin" id="allin">All-in</button>
        </div>
        ${slider}
      </div>${add}`;
    }
    return `<div class="actionbar idle">${pk.handLive ? '<span class="hint">Waiting\u2026</span>' : ""}${add}</div>`;
  }
  function renderPoker() {
    const pk = state.poker;
    // Start the raise slider at the minimum each new turn; keep the value while it's still my decision.
    if (pk.myTurn && pk.legal) {
      const key = pk.phase + ":" + pk.currentBet + ":" + pk.toAct;
      if (key !== lastTurnKey) { raiseTo = pk.legal.minRaiseTo; lastTurnKey = key; }
      if (raiseTo < pk.legal.minRaiseTo) raiseTo = pk.legal.minRaiseTo;
      if (raiseTo > pk.legal.maxRaiseTo) raiseTo = pk.legal.maxRaiseTo;
    } else {
      lastTurnKey = null;
    }
    app.innerHTML = `
    <div class="table">
      <header class="top">
        <div class="codebox" id="codebox"><span class="codelabel">TABLE CODE</span><span class="codeval">${esc(state.code)}</span><span class="copy">tap to copy</span></div>
        <button class="iconbtn" id="menu">\u22EF</button>
      </header>
      <div class="players pokerplayers">
        ${pk.players.map((p) => {
          const badges = (p.isButton ? '<span class="badge btn">D</span>' : "") + (p.isSB ? '<span class="badge">SB</span>' : "") + (p.isBB ? '<span class="badge">BB</span>' : "");
          const status = p.folded ? "folded" : (p.allIn ? "all-in" : (p.away ? "away" : ""));
          return `<div class="pseat${p.isTurn ? " turn" : ""}${p.folded ? " folded" : ""}">
            <div class="pseat-top">${badges}<span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div>
            <div class="pchips">\uD83E\uDE99 ${p.chips}</div>
            ${p.cRound ? `<div class="pbet">bet ${p.cRound}</div>` : ""}
            ${status ? `<div class="pstatus">${status}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
      <div class="felt pokerfelt">
        <div class="pokerinfo">${pk.handLive ? `<b>${pk.phase.toUpperCase()}</b> \u00b7 Pot ${pk.pot} \u00b7 Blinds ${pk.sb}/${pk.bb}` : `Blinds ${pk.sb}/${pk.bb}`}</div>
        <div class="board">
          ${(pk.community || []).map((c) => `<div class="bcard">${cardInner(c, true)}</div>`).join("")}
          ${pk.handLive ? Array(Math.max(0, 5 - (pk.community || []).length)).fill('<div class="bslot"></div>').join("") : ""}
        </div>
        ${pokerCenter(pk)}
      </div>
      <div class="hand pokerhand">
        ${pk.myHole ? `<div class="holecards">${pk.myHole.map((c) => `<div class="holecard">${cardInner(c, true)}</div>`).join("")}${pk.myFolded ? '<span class="foldedtag">folded</span>' : ""}</div>` : '<div class="holecards"><span class="emptyhand">Not in this hand</span></div>'}
        ${actionBar(pk)}
      </div>
    </div>`;

    const $ = (id) => document.getElementById(id);
    $("codebox").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
    $("menu").onclick = () => { sheet = { kind: "pmenu" }; renderSheet(); };
    if ($("deal")) $("deal").onclick = () => emit("pokerStart");
    if ($("addchips")) $("addchips").onclick = () => { sheet = { kind: "addchips" }; renderSheet(); };
    if ($("fold")) $("fold").onclick = () => emit("pokerAction", { action: "fold" });
    if ($("callcheck")) $("callcheck").onclick = () => emit("pokerAction", { action: pk.legal.canCheck ? "check" : "call" });
    if ($("allin")) $("allin").onclick = () => emit("pokerAction", { action: "allin" });
    if ($("raise")) $("raise").onclick = () => emit("pokerAction", { action: "raise", amount: raiseTo });
    if ($("showhand")) $("showhand").onclick = () => emit("pokerReveal", { show: true });
    if ($("muck")) $("muck").onclick = () => emit("pokerReveal", { show: false });
    const sl = $("rslider");
    if (sl) {
      const L = pk.legal, bb = pk.bb || 10;
      const clampBB = (x) => Math.max(L.minRaiseTo, Math.min(L.maxRaiseTo, Math.round(x / bb) * bb));
      const setVal = (v) => {
        raiseTo = clampBB(v); sl.value = raiseTo;
        const a = $("ramt"); if (a) a.textContent = raiseTo;
        const rb = $("raise"); if (rb) rb.textContent = "Raise to " + raiseTo;
      };
      sl.oninput = () => setVal(parseInt(sl.value, 10) || L.minRaiseTo);
      document.querySelectorAll(".rpreset").forEach((b) => {
        b.onclick = () => {
          const rp = b.getAttribute("data-rp");
          if (rp === "min") setVal(L.minRaiseTo);
          else if (rp === "max") setVal(L.maxRaiseTo);
          else if (rp === "pot") setVal(pk.currentBet + pk.pot);
          else if (rp === "half") setVal(pk.currentBet + Math.round(pk.pot / 2));
        };
      });
    }
  }

  /* ---------------- Go Fish UI ---------------- */
  const rlabel = (r) => RLAB[r] || r;
  function renderGoFish() {
    const gf = state.gofish;
    const head = `<header class="top"><div class="codebox" id="codebox"><span class="codelabel">TABLE CODE</span><span class="codeval">${esc(state.code)}</span><span class="copy">tap to copy</span></div><button class="iconbtn" id="menu">\u22EF</button></header>`;
    const wireTop = () => {
      const $ = (id) => document.getElementById(id);
      $("codebox").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
      $("menu").onclick = () => { sheet = { kind: "menu" }; renderSheet(); };
    };
    if (!gf || !gf.started || gf.phase === "over") {
      const over = gf && gf.results;
      const canStart = state.players.length >= 2;
      let inner;
      if (over) {
        const stand = gf.results.standings.map((s) => `<div class="showrow"><span class="sn">${esc(s.name)}</span><span class="shand">${s.books} book${s.books === 1 ? "" : "s"}</span></div>`).join("");
        const win = gf.results.winners.map((c) => { const p = gf.players.find((x) => x.id === c); return esc(p ? p.name : ""); }).join(" & ");
        inner = `<div class="sooncard"><h2 class="soontitle">\uD83C\uDFC6 ${win}</h2><div class="showlist">${stand}</div>${canStart ? '<button class="btn primary" id="gfstart">New game</button>' : '<div class="hint">Need 2+ players</div>'}</div>`;
      } else {
        inner = `<div class="sooncard"><div class="suits small">\u2660 \u2665 \u2666 \u2663</div><h2 class="soontitle">Go Fish</h2><p class="soonmsg">${canStart ? "Everyone in? Deal to begin." : "Waiting for players \u2014 need at least 2."}</p>${canStart ? '<button class="btn primary" id="gfstart">Deal &amp; start</button>' : ""}</div>`;
      }
      app.innerHTML = `<div class="table">${head}<div class="felt soonfelt">${inner}</div></div>`;
      wireTop();
      const gs = document.getElementById("gfstart"); if (gs) gs.onclick = () => emit("gofishStart");
      return;
    }
    const locked = !!gf.locked;
    if (!gf.myTurn || locked) askRank = null;
    const turnName = (gf.players.find((p) => p.isTurn) || {}).name;
    const playersHtml = gf.players.map((p) => `<div class="pseat${p.isTurn ? " turn" : ""}${p.away ? " folded" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div><div class="gfstats">\uD83C\uDCA0 ${p.handCount} \u00b7 \uD83D\uDCDA ${p.booksCount}</div>${p.books.length ? `<div class="bookranks">${p.books.map((r) => rlabel(r)).join(" ")}</div>` : ""}</div>`).join("");
    const logHtml = (gf.log || []).map((l) => `<div class="logline">${esc(l)}</div>`).join("");
    const selectable = gf.myTurn && !locked;
    const myHandHtml = gf.myHand.map((code) => {
      const r = code.slice(0, -1);
      const sel = selectable && askRank === r ? " sel" : "";
      return `<div class="gfcard${sel}"${selectable ? ` data-gfpick="${r}"` : ""}>${cardInner(code, true)}</div>`;
    }).join("");
    let action;
    if (locked) {
      const last = (gf.log || [])[gf.log.length - 1] || "";
      action = `<div class="gfaction"><div class="gfbeat">${esc(last)}</div></div>`;
    } else if (gf.myTurn) {
      const targets = gf.players.filter((p) => !p.me && p.handCount > 0)
        .map((p) => `<button class="pbtn gftarget" data-gftarget="${p.id}">Ask ${esc(p.name)}</button>`).join("");
      const prompt = askRank
        ? `<div class="gflabel">Asking for <b>${rlabel(askRank)}s</b> \u2014 tap who to ask</div><div class="targetrow">${targets}</div>`
        : `<div class="gflabel">Your turn \u2014 tap a card to choose what to ask for</div>`;
      action = `<div class="gfaction">${prompt}</div>`;
    } else {
      action = `<div class="gfaction idle"><span class="hint">${turnName ? esc(turnName) + " is deciding\u2026" : ""}</span></div>`;
    }
    app.innerHTML = `<div class="table">${head}
      <div class="players pokerplayers">${playersHtml}</div>
      <div class="felt pokerfelt">
        <div class="pokerinfo">Pool: ${gf.poolCount} card${gf.poolCount === 1 ? "" : "s"}</div>
        <div class="gflog">${logHtml}</div>
      </div>
      <div class="hand pokerhand">
        <div class="handlabel">YOUR HAND <span>${gf.myHand.length} cards \u00b7 only you can see these</span></div>
        <div class="gfhand">${myHandHtml || '<span class="emptyhand">No cards</span>'}</div>
        ${action}
      </div></div>`;
    wireTop();
    app.querySelectorAll("[data-gfpick]").forEach((el) => el.onclick = () => { const r = el.getAttribute("data-gfpick"); askRank = (askRank === r ? null : r); renderGoFish(); });
    app.querySelectorAll("[data-gftarget]").forEach((b) => b.onclick = () => {
      if (!askRank) { toast("Tap a card first"); return; }
      emit("gofishAsk", { target: b.getAttribute("data-gftarget"), rank: askRank }); askRank = null;
    });
  }

  /* ---------------- Blackjack UI ---------------- */
  function renderBlackjack() {
    const bj = state.blackjack;
    const head = `<header class="top"><div class="codebox" id="codebox"><span class="codelabel">TABLE CODE</span><span class="codeval">${esc(state.code)}</span><span class="copy">tap to copy</span></div><button class="iconbtn" id="menu">\u22EF</button></header>`;
    if (!bj) { app.innerHTML = `<div class="table">${head}<div class="felt soonfelt"><div class="sooncard"><div class="hint">Starting\u2026</div></div></div></div>`; const $ = (id) => document.getElementById(id); $("codebox").onclick = () => toast("Code copied"); $("menu").onclick = () => { sheet = { kind: "menu" }; renderSheet(); }; return; }
    const dealerCards = bj.dealer.cards.map((c) => `<div class="bjcard">${cardInner(c || "", c != null)}</div>`).join("");
    const dealerTotal = bj.dealer.revealed && bj.dealer.total != null ? `<span class="bjt">${bj.dealer.total}</span>` : "";
    const dealerHtml = `<div class="bjdealer"><div class="bjwho">Dealer ${dealerTotal}</div><div class="bjcards">${dealerCards || '<span class="hint">\u2014</span>'}</div></div>`;
    const playersHtml = bj.players.map((p) => {
      if (bj.phase === "betting") {
        return `<div class="pseat${p.me ? " me" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div><div class="pchips">\uD83E\uDE99 ${p.chips}</div>${p.bet ? `<div class="pbet">bet ${p.bet}</div>` : ""}</div>`;
      }
      const cards = (p.cards || []).map((c) => `<div class="bjcard sm">${cardInner(c, true)}</div>`).join("");
      const res = p.result ? `<div class="bjres ${p.result}">${p.result === "blackjack" ? "BLACKJACK" : p.result.toUpperCase()}${p.payout ? " +" + p.payout : ""}</div>` : "";
      const status = !p.result ? (p.busted ? "bust" : (p.bj ? "blackjack!" : (p.doubled ? "doubled" : (p.stood ? "stand" : "")))) : "";
      return `<div class="pseat${p.isTurn ? " turn" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span><span class="bjt">${p.total}</span></div><div class="bjcards small">${cards}</div><div class="pchips">\uD83E\uDE99 ${p.chips} \u00b7 bet ${p.bet}</div>${status ? `<div class="pstatus">${status}</div>` : ""}${res}</div>`;
    }).join("");
    let action;
    if (bj.phase === "betting") {
      const max = bj.myChips, min = Math.min(bj.minBet, max);
      if (betAmt < min) betAmt = min; if (betAmt > max) betAmt = max;
      const slider = (max >= min && max > 0)
        ? `<div class="raisebox"><div class="rtop"><span class="rlabel">Your bet</span><span class="ramt" id="betamt">${betAmt}</span></div><input type="range" class="rslider" id="betslider" min="${min}" max="${max}" step="${bj.minBet}" value="${betAmt}"><div class="rpresets"><button class="rpreset" data-bp="min">Min</button><button class="rpreset" data-bp="half">\u00BD</button><button class="rpreset" data-bp="max">Max</button><button class="pbtn raise" id="placebet">Bet ${betAmt}</button></div></div>`
        : '<div class="hint">No chips yet \u2014 add some below.</div>';
      action = `<div class="actionbar bjbet">${slider}${bj.myBet ? `<div class="hint">Your bet is in: ${bj.myBet} \u2014 adjust above to change.</div>` : ""}<div class="actrow">${bj.canDeal ? '<button class="pbtn call" id="bjdeal">Deal</button>' : '<span class="hint">Place a bet, then Deal</span>'}</div></div><button class="pbtn add" id="addchips">\uFF0B Add chips</button>`;
    } else if (bj.phase === "done") {
      action = `<div class="actionbar"><div class="actrow"><button class="pbtn call" id="bjnew">New round</button></div></div><button class="pbtn add" id="addchips">\uFF0B Add chips</button>`;
    } else if (bj.myTurn && bj.legal) {
      const L = bj.legal;
      action = `<div class="actionbar"><div class="actrow"><button class="pbtn call" id="bjhit">Hit</button><button class="pbtn" id="bjstand">Stand</button>${L.canDouble ? '<button class="pbtn allin" id="bjdouble">Double</button>' : ""}</div></div>`;
    } else {
      const t = (bj.players.find((p) => p.isTurn) || {}).name;
      action = `<div class="actionbar idle"><span class="hint">${bj.phase === "dealer" ? "Dealer playing\u2026" : (t ? esc(t) + " deciding\u2026" : "")}</span></div>`;
    }
    app.innerHTML = `<div class="table">${head}
      <div class="felt pokerfelt bjfelt">
        <div class="pokerinfo">Blackjack \u00b7 min bet ${bj.minBet}</div>
        ${dealerHtml}
        <div class="players pokerplayers bjplayers">${playersHtml}</div>
      </div>
      <div class="hand pokerhand">${action}</div></div>`;
    const $ = (id) => document.getElementById(id);
    $("codebox").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
    $("menu").onclick = () => { sheet = { kind: "menu" }; renderSheet(); };
    if ($("addchips")) $("addchips").onclick = () => { sheet = { kind: "addchips" }; renderSheet(); };
    if ($("bjdeal")) $("bjdeal").onclick = () => emit("bjDeal");
    if ($("bjnew")) $("bjnew").onclick = () => emit("bjStart");
    if ($("bjhit")) $("bjhit").onclick = () => emit("bjAction", { action: "hit" });
    if ($("bjstand")) $("bjstand").onclick = () => emit("bjAction", { action: "stand" });
    if ($("bjdouble")) $("bjdouble").onclick = () => emit("bjAction", { action: "double" });
    if ($("placebet")) $("placebet").onclick = () => emit("bjBet", { amount: betAmt });
    const sl = $("betslider");
    if (sl) {
      const step = bj.minBet, max = bj.myChips, min = Math.min(bj.minBet, max);
      const clamp = (x) => Math.max(min, Math.min(max, Math.round(x / step) * step));
      const setVal = (v) => { betAmt = clamp(v); sl.value = betAmt; const a = $("betamt"); if (a) a.textContent = betAmt; const pb = $("placebet"); if (pb) pb.textContent = "Bet " + betAmt; };
      sl.oninput = () => setVal(parseInt(sl.value, 10) || min);
      document.querySelectorAll("[data-bp]").forEach((b) => b.onclick = () => { const k = b.getAttribute("data-bp"); setVal(k === "min" ? min : k === "max" ? max : Math.round(max / 2)); });
    }
  }

  /* ---------------- shared helpers for the extra games ---------------- */
  function gHead() { return `<header class="top"><div class="codebox" id="codebox"><span class="codelabel">TABLE CODE</span><span class="codeval">${esc(state.code)}</span><span class="copy">tap to copy</span></div><button class="iconbtn" id="menu">\u22EF</button></header>`; }
  function wireHead() {
    const c = document.getElementById("codebox"); if (c) c.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
    const m = document.getElementById("menu"); if (m) m.onclick = () => { sheet = { kind: "menu" }; renderSheet(); };
    const a = document.getElementById("addchips"); if (a) a.onclick = () => { sheet = { kind: "addchips" }; renderSheet(); };
  }
  function startScreen(title, msg, canStart, startEv, btnLabel) {
    const inner = `<div class="sooncard"><div class="suits small">\u2660 \u2665 \u2666 \u2663</div><h2 class="soontitle">${title}</h2><p class="soonmsg">${msg}</p>${canStart ? `<button class="btn primary" id="gstart">${btnLabel}</button>` : ""}</div>`;
    app.innerHTML = `<div class="table">${gHead()}<div class="felt soonfelt">${inner}</div></div>`;
    wireHead(); const b = document.getElementById("gstart"); if (b) b.onclick = () => emit(startEv);
  }
  function overScreen(title, rows, canStart, startEv, btnLabel) {
    const inner = `<div class="sooncard"><h2 class="soontitle">\uD83C\uDFC6 ${title}</h2>${rows ? `<div class="showlist">${rows}</div>` : ""}${canStart ? `<button class="btn primary" id="gstart">${btnLabel}</button>` : '<div class="hint">Not enough players to restart</div>'}</div>`;
    app.innerHTML = `<div class="table">${gHead()}<div class="felt soonfelt">${inner}</div></div>`;
    wireHead(); const b = document.getElementById("gstart"); if (b) b.onclick = () => emit(startEv);
  }
  const seatRow = (players, extra) => `<div class="players pokerplayers">` + players.map(extra).join("") + `</div>`;
  const logBox = (log) => `<div class="gflog">${(log || []).map((l) => `<div class="logline">${esc(l)}</div>`).join("")}</div>`;

  /* ---------------- War ---------------- */
  function renderWar() {
    const w = state.war;
    if (!w || !w.started) return startScreen("War", state.players.length === 2 ? "Two players ready \u2014 deal to begin." : "War is for exactly 2 players.", state.players.length === 2, "warStart", "Deal &amp; start");
    if (w.phase === "over" || w.winner) {
      const wn = (w.players.find((p) => p.id === w.winner) || {}).name || "";
      const rows = w.players.map((p) => `<div class="showrow"><span class="sn">${esc(p.name)}</span><span class="shand">${p.count} cards</span></div>`).join("");
      return overScreen(esc(wn) + " takes the lot!", rows, state.players.length === 2, "warStart", "Play again");
    }
    const lb = w.lastBattle;
    const piles = w.players.map((p) => `<div class="warpile${p.me ? " me" : ""}"><div class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</div><div class="warback"><div class="back"></div></div><div class="warcount">${p.count} cards</div></div>`).join('<div class="warvs">VS</div>');
    let battle = '<div class="warbattle empty">Tap Flip to do battle</div>';
    if (lb) {
      const side = (s) => `<div class="warside"><div class="tn">${esc(s.name)}</div><div class="warcards">${s.cards.map((c, i) => `<div class="warcard${i === s.cards.length - 1 ? "" : " facedown"}">${cardInner(c, i === s.cards.length - 1)}</div>`).join("")}</div></div>`;
      const winName = (w.players.find((p) => p.id === lb.winner) || {}).name || "";
      battle = `<div class="warbattle">${side(lb.a)}<div class="warmid">${lb.war ? '<div class="wartag">WAR!</div>' : ""}<div class="warwon">${esc(winName)} wins</div></div>${side(lb.b)}</div>`;
    }
    app.innerHTML = `<div class="table">${gHead()}
      <div class="felt pokerfelt warfelt">
        <div class="warpiles">${piles}</div>
        ${battle}
        ${logBox(w.log)}
      </div>
      <div class="hand pokerhand"><div class="actionbar"><div class="actrow"><button class="pbtn call" id="warflip">\u2694\uFE0F Flip</button></div></div></div></div>`;
    wireHead();
    const fb = document.getElementById("warflip"); if (fb) fb.onclick = () => emit("warFlip");
  }

  /* ---------------- Crazy Eights ---------------- */
  function renderCrazy8() {
    const g = state.c8;
    if (!g || !g.started) return startScreen("Crazy Eights", state.players.length >= 2 ? "Match the rank or suit \u2014 eights are wild." : "Need at least 2 players.", state.players.length >= 2, "c8Start", "Deal &amp; start");
    if (g.winner) {
      const wn = (g.players.find((p) => p.id === g.winner) || {}).name || "";
      const rows = g.players.map((p) => `<div class="showrow"><span class="sn">${esc(p.name)}</span><span class="shand">${p.count} card${p.count === 1 ? "" : "s"}</span></div>`).join("");
      return overScreen(esc(wn) + " goes out \u2014 wins!", rows, state.players.length >= 2, "c8Start", "Play again");
    }
    const players = seatRow(g.players, (p) => `<div class="pseat${p.isTurn ? " turn" : ""}${p.away ? " folded" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div><div class="gfstats">\uD83C\uDCA0 ${p.count}</div></div>`);
    const suitSym = SUIT[g.suit] ? SUIT[g.suit][0] : g.suit;
    const playable = new Set(g.playable || []);
    const myHand = g.myHand.map((code) => {
      const ok = g.myTurn && playable.has(code) && !c8Eight;
      return `<div class="gfcard${ok ? " playable" : (g.myTurn ? " dim" : "")}"${ok ? ` data-c8play="${code}"` : ""}>${cardInner(code, true)}</div>`;
    }).join("");
    let action;
    if (c8Eight) {
      action = `<div class="gfaction"><div class="gflabel">Choose a suit for your 8</div><div class="suitpick">` + ["S", "H", "D", "C"].map((s) => `<button class="suitbtn ${isRed(s) ? "red" : "black"}" data-c8suit="${s}">${SUIT[s][0]}</button>`).join("") + `</div><button class="pbtn fold" id="c8cancel">Cancel</button></div>`;
    } else if (g.myTurn) {
      action = `<div class="gfaction"><div class="gflabel">Your turn \u2014 play a card${(g.playable && g.playable.length) ? "" : ", or draw"}</div><div class="actrow"><button class="pbtn call" id="c8draw">Draw</button>${g.drew ? '<button class="pbtn" id="c8pass">Pass</button>' : ""}</div></div>`;
    } else {
      const t = (g.players.find((p) => p.isTurn) || {}).name;
      action = `<div class="gfaction idle"><span class="hint">${t ? esc(t) + " is playing\u2026" : ""}</span></div>`;
    }
    app.innerHTML = `<div class="table">${gHead()}${players}
      <div class="felt pokerfelt">
        <div class="c8center"><div class="c8top">${cardInner(g.top, true)}</div><div class="c8meta"><div class="c8suit ${isRed(g.suit) ? "red" : "black"}">${suitSym}</div><div class="c8stock">Stock ${g.stockCount}</div></div></div>
        ${logBox(g.log)}
      </div>
      <div class="hand pokerhand">
        <div class="handlabel">YOUR HAND <span>${g.myHand.length} cards</span></div>
        <div class="gfhand">${myHand || '<span class="emptyhand">No cards</span>'}</div>
        ${action}
      </div></div>`;
    wireHead();
    app.querySelectorAll("[data-c8play]").forEach((el) => el.onclick = () => { const code = el.getAttribute("data-c8play"); if (code.slice(0, -1) === "8") { c8Eight = code; renderCrazy8(); } else emit("c8Play", { card: code }); });
    app.querySelectorAll("[data-c8suit]").forEach((b) => b.onclick = () => { emit("c8Play", { card: c8Eight, suit: b.getAttribute("data-c8suit") }); c8Eight = null; });
    const cc = document.getElementById("c8cancel"); if (cc) cc.onclick = () => { c8Eight = null; renderCrazy8(); };
    const dr = document.getElementById("c8draw"); if (dr) dr.onclick = () => emit("c8Draw");
    const ps = document.getElementById("c8pass"); if (ps) ps.onclick = () => emit("c8Pass");
  }

  /* ---------------- Cheat (Bluff) ---------------- */
  function renderCheat() {
    const g = state.cheat;
    if (!g || !g.started) return startScreen("Cheat (Bluff)", state.players.length >= 3 ? "Claim the next rank up \u2014 lie if you must." : "Cheat needs 3\u20136 players.", state.players.length >= 3, "cheatStart", "Deal &amp; start");
    if (g.winner) {
      const wn = (g.players.find((p) => p.id === g.winner) || {}).name || "";
      return overScreen(esc(wn) + " empties their hand \u2014 wins!", "", state.players.length >= 3, "cheatStart", "Play again");
    }
    const players = seatRow(g.players, (p) => `<div class="pseat${p.isTurn ? " turn" : ""}${p.away ? " folded" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div><div class="gfstats">\uD83C\uDCA0 ${p.count}</div></div>`);
    let reveal = "";
    if (g.reveal) {
      const r = g.reveal;
      const cardsHtml = r.cards.map((c) => `<div class="warcard">${cardInner(c, true)}</div>`).join("");
      reveal = `<div class="revealbox ${r.truthful ? "truth" : "lie"}"><div class="revealhdr">${esc(r.by)} called Cheat on ${esc(r.player)}</div><div class="revealcards">${cardsHtml}</div><div class="revealverdict">${r.truthful ? "Honest \u2014 " : "Bluff \u2014 "}${esc(r.loser)} takes ${r.taken} card${r.taken === 1 ? "" : "s"}</div></div>`;
    }
    const lp = g.lastPlay ? `<div class="cheatlast">${esc(g.lastPlay.name)} claimed ${g.lastPlay.count} \u00d7 ${esc(g.lastPlay.claimLabel)}</div>` : '<div class="cheatlast">Pile is empty \u2014 start the round</div>';
    const selectable = g.myTurn;
    const myHand = g.myHand.map((code) => `<div class="gfcard${multiSel.includes(code) ? " sel" : ""}"${selectable ? ` data-cheatpick="${code}"` : ""}>${cardInner(code, true)}</div>`).join("");
    let action;
    if (g.myTurn) {
      const n = multiSel.length, canPlay = n >= 1 && n <= 4;
      action = `<div class="gfaction"><div class="gflabel">Your turn \u2014 claim <b>${esc(g.reqLabel)}</b>. Pick 1\u20134 cards.</div><div class="actrow"><button class="pbtn call${canPlay ? "" : " disabled"}" id="cheatplay">Play ${n || ""} as ${esc(g.reqLabel)}</button>${g.canChallenge ? '<button class="pbtn fold" id="cheatcall">Cheat!</button>' : ""}</div></div>`;
    } else {
      const t = (g.players.find((p) => p.isTurn) || {}).name;
      action = `<div class="gfaction idle"><span class="hint">${t ? esc(t) + " is playing\u2026" : ""}</span>${g.canChallenge ? '<button class="pbtn fold" id="cheatcall">Cheat!</button>' : ""}</div>`;
    }
    app.innerHTML = `<div class="table">${gHead()}${players}
      <div class="felt pokerfelt">
        <div class="cheatinfo">Pile ${g.pileCount} \u00b7 Claim <b>${esc(g.reqLabel)}</b></div>
        ${lp}${reveal}
        ${logBox(g.log)}
      </div>
      <div class="hand pokerhand">
        <div class="handlabel">YOUR HAND <span>${g.myHand.length} cards</span></div>
        <div class="gfhand">${myHand || '<span class="emptyhand">No cards</span>'}</div>
        ${action}
      </div></div>`;
    wireHead();
    app.querySelectorAll("[data-cheatpick]").forEach((el) => el.onclick = () => { const c = el.getAttribute("data-cheatpick"); const i = multiSel.indexOf(c); if (i >= 0) multiSel.splice(i, 1); else if (multiSel.length < 4) multiSel.push(c); renderCheat(); });
    const pl = document.getElementById("cheatplay"); if (pl) pl.onclick = () => { if (multiSel.length < 1 || multiSel.length > 4) { toast("Pick 1\u20134 cards"); return; } emit("cheatPlay", { cards: multiSel.slice() }); multiSel = []; };
    const ca = document.getElementById("cheatcall"); if (ca) ca.onclick = () => emit("cheatChallenge");
  }

  /* ---------------- Hearts ---------------- */
  function renderHearts() {
    const h = state.hearts;
    if (!h || !h.started) return startScreen("Hearts", state.players.length === 4 ? "Four players ready." : "Hearts needs exactly 4 players.", state.players.length === 4, "heartsStart", "Deal &amp; start");
    if (h.phase === "over") {
      const rows = h.results.standings.map((s) => `<div class="showrow"><span class="sn">${esc(s.name)}</span><span class="shand">${s.score}</span></div>`).join("");
      const win = h.results.winners.map((c) => { const p = h.players.find((x) => x.id === c); return esc(p ? p.name : ""); }).join(" &amp; ");
      return overScreen(win + " wins (lowest)!", rows, state.players.length === 4, "heartsStart", "New game");
    }
    const scoreboard = seatRow(h.players, (p) => `<div class="pseat${p.isTurn ? " turn" : ""}${p.isLeader ? " leader" : ""}${p.away ? " folded" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span><span class="bjt">${p.score}</span></div><div class="gfstats">\uD83C\uDCA0 ${p.count}</div></div>`);
    if (h.phase === "handover") {
      const rows = h.lastHand.map((r) => `<div class="showrow"><span class="sn">${esc(r.name)}</span><span class="shand">+${r.hand} \u00b7 ${r.total} total</span></div>`).join("");
      app.innerHTML = `<div class="table">${gHead()}${scoreboard}<div class="felt pokerfelt"><div class="pokerinfo">Hand over</div><div class="showlist">${rows}</div><div class="actrow"><button class="pbtn call" id="heartsnext">Next hand</button></div></div></div>`;
      wireHead(); const n = document.getElementById("heartsnext"); if (n) n.onclick = () => emit("heartsNext"); return;
    }
    const trick = `<div class="trickarea">` + (h.trick.length ? h.trick.map((t) => `<div class="trickcard"><div class="tn">${esc(t.name)}</div>${cardInner(t.card, true)}</div>`).join("") : '<div class="hint">\u2014 trick \u2014</div>') + `</div>`;
    let handArea;
    if (h.phase === "pass") {
      const dir = { left: "left \u2192", right: "\u2190 right", across: "across", hold: "hold" }[h.passDir] || h.passDir;
      const sel = new Set(multiSel);
      const myHand = h.myHand.map((code) => `<div class="gfcard${sel.has(code) ? " sel" : ""}" data-hpass="${code}">${cardInner(code, true)}</div>`).join("");
      const act = h.iPassed
        ? `<div class="gfaction idle"><span class="hint">Cards passed \u2014 waiting for the table\u2026</span></div>`
        : `<div class="gfaction"><div class="gflabel">Pass 3 cards <b>${dir}</b></div><div class="actrow"><button class="pbtn call${multiSel.length === 3 ? "" : " disabled"}" id="heartspass">Pass ${multiSel.length}/3</button></div></div>`;
      handArea = `<div class="handlabel">YOUR HAND</div><div class="gfhand">${myHand}</div>${act}`;
    } else {
      const legal = new Set(h.legal || []);
      const myHand = h.myHand.map((code) => { const ok = h.myTurn && !h.locked && legal.has(code); return `<div class="gfcard${ok ? " playable" : (h.myTurn ? " dim" : "")}"${ok ? ` data-hplay="${code}"` : ""}>${cardInner(code, true)}</div>`; }).join("");
      let act;
      if (h.locked) act = `<div class="gfaction idle"><span class="hint">resolving\u2026</span></div>`;
      else if (h.myTurn) act = `<div class="gfaction"><div class="gflabel">Your turn \u2014 tap a card to play</div></div>`;
      else { const t = (h.players.find((p) => p.isTurn) || {}).name; act = `<div class="gfaction idle"><span class="hint">${t ? esc(t) + "\u2026" : ""}</span></div>`; }
      handArea = `<div class="handlabel">YOUR HAND <span>${h.heartsBroken ? "hearts broken" : "hearts not broken"}</span></div><div class="gfhand">${myHand}</div>${act}`;
    }
    app.innerHTML = `<div class="table">${gHead()}${scoreboard}<div class="felt pokerfelt">${trick}${logBox(h.log)}</div><div class="hand pokerhand">${handArea}</div></div>`;
    wireHead();
    app.querySelectorAll("[data-hpass]").forEach((el) => el.onclick = () => { const c = el.getAttribute("data-hpass"); const i = multiSel.indexOf(c); if (i >= 0) multiSel.splice(i, 1); else if (multiSel.length < 3) multiSel.push(c); renderHearts(); });
    const pb = document.getElementById("heartspass"); if (pb) pb.onclick = () => { if (multiSel.length !== 3) { toast("Pick 3 cards"); return; } emit("heartsPass", { cards: multiSel.slice() }); multiSel = []; };
    app.querySelectorAll("[data-hplay]").forEach((el) => el.onclick = () => emit("heartsPlay", { card: el.getAttribute("data-hplay") }));
  }

  /* ---------------- Spades ---------------- */
  function renderSpades() {
    const s = state.spades;
    if (!s || !s.started) return startScreen("Spades", state.players.length === 4 ? "Four players \u2014 partners sit across." : "Spades needs exactly 4 players.", state.players.length === 4, "spadesStart", "Deal &amp; start");
    if (s.phase === "over") {
      const rows = `<div class="showrow"><span class="sn">Team A</span><span class="shand">${s.results.scores.A}</span></div><div class="showrow"><span class="sn">Team B</span><span class="shand">${s.results.scores.B}</span></div>`;
      return overScreen(esc(s.results.winTeam) + " win!", rows, state.players.length === 4, "spadesStart", "New game");
    }
    const teamLine = `<div class="scoreboard"><div class="teamcard ${s.myTeam === "A" ? "mine" : ""}">Team A \u00b7 <b>${s.teams.A.score}</b> <span class="bags">\uD83D\uDCB0${s.teams.A.bags}</span></div><div class="teamcard ${s.myTeam === "B" ? "mine" : ""}">Team B \u00b7 <b>${s.teams.B.score}</b> <span class="bags">\uD83D\uDCB0${s.teams.B.bags}</span></div></div>`;
    const players = seatRow(s.players, (p) => `<div class="pseat${p.isTurn ? " turn" : ""}${p.away ? " folded" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""} <small class="tt">${p.team}</small></span></div><div class="gfstats">${p.bid == null ? "\u2014" : (p.bid === 0 ? "Nil" : p.bid)} bid \u00b7 ${p.tricks} won \u00b7 \uD83C\uDCA0${p.count}</div></div>`);
    if (s.phase === "handover") {
      const rows = s.lastHand.map((t) => `<div class="showrow"><span class="sn">Team ${t.key}</span><span class="shand">bid ${t.bid}, won ${t.tricks} \u2014 ${t.delta >= 0 ? "+" : ""}${t.delta} \u00b7 ${t.total}</span></div>`).join("");
      app.innerHTML = `<div class="table">${gHead()}${teamLine}<div class="felt pokerfelt"><div class="pokerinfo">Hand scored</div><div class="showlist">${rows}</div><div class="actrow"><button class="pbtn call" id="spadesnext">Next hand</button></div></div></div>`;
      wireHead(); const n = document.getElementById("spadesnext"); if (n) n.onclick = () => emit("spadesNext"); return;
    }
    const trick = `<div class="trickarea">` + (s.trick.length ? s.trick.map((t) => `<div class="trickcard"><div class="tn">${esc(t.name)}</div>${cardInner(t.card, true)}</div>`).join("") : '<div class="hint">\u2014 trick \u2014</div>') + `</div>`;
    let handArea;
    if (s.phase === "bid") {
      if (s.myBidTurn) {
        const btns = []; for (let i = 0; i <= 13; i++) btns.push(`<button class="bidbtn" data-bid="${i}">${i === 0 ? "Nil" : i}</button>`);
        handArea = `<div class="bidpicker"><div class="gflabel">Your bid \u2014 how many tricks?</div><div class="bidgrid">${btns.join("")}</div></div>`;
      } else {
        const t = (s.players.find((p) => p.isTurn) || {}).name;
        handArea = `<div class="gfaction idle"><span class="hint">${t ? esc(t) + " is bidding\u2026" : "Bidding\u2026"}</span></div>`;
      }
    } else {
      const legal = new Set(s.legal || []);
      const myHand = s.myHand.map((code) => { const ok = s.myTurn && !s.locked && legal.has(code); return `<div class="gfcard${ok ? " playable" : (s.myTurn ? " dim" : "")}"${ok ? ` data-splay="${code}"` : ""}>${cardInner(code, true)}</div>`; }).join("");
      let act;
      if (s.locked) act = `<div class="gfaction idle"><span class="hint">resolving\u2026</span></div>`;
      else if (s.myTurn) act = `<div class="gfaction"><div class="gflabel">Your turn \u2014 tap a card</div></div>`;
      else { const t = (s.players.find((p) => p.isTurn) || {}).name; act = `<div class="gfaction idle"><span class="hint">${t ? esc(t) + "\u2026" : ""}</span></div>`; }
      handArea = `<div class="handlabel">YOUR HAND <span>${s.spadesBroken ? "spades broken" : "spades not broken"}</span></div><div class="gfhand">${myHand}</div>${act}`;
    }
    app.innerHTML = `<div class="table">${gHead()}${teamLine}${players}<div class="felt pokerfelt">${trick}${logBox(s.log)}</div><div class="hand pokerhand">${handArea}</div></div>`;
    wireHead();
    app.querySelectorAll("[data-bid]").forEach((b) => b.onclick = () => emit("spadesBid", { n: parseInt(b.getAttribute("data-bid"), 10) }));
    app.querySelectorAll("[data-splay]").forEach((el) => el.onclick = () => emit("spadesPlay", { card: el.getAttribute("data-splay") }));
  }

  /* ---------------- Gin Rummy ---------------- */
  function renderGin() {
    const g = state.gin;
    if (!g || !g.started) return startScreen("Gin Rummy", state.players.length === 2 ? "Two players ready." : "Gin Rummy needs exactly 2 players.", state.players.length === 2, "ginStart", "Deal &amp; start");
    if (g.phase === "over") {
      const rows = g.results.standings.map((s) => `<div class="showrow"><span class="sn">${esc(s.name)}</span><span class="shand">${s.score}</span></div>`).join("");
      const win = g.results.winners.map((c) => { const p = g.players.find((x) => x.id === c); return esc(p ? p.name : ""); }).join(" &amp; ");
      return overScreen(win + " wins!", rows, state.players.length === 2, "ginStart", "New game");
    }
    const opp = g.players.find((p) => !p.me) || {}, me = g.players.find((p) => p.me) || {};
    const head2 = `<div class="players pokerplayers"><div class="pseat${opp.isTurn ? " turn" : ""}"><div class="pseat-top"><span class="pn">${esc(opp.name || "Opponent")}</span><span class="bjt">${opp.score || 0}</span></div><div class="gfstats">\uD83C\uDCA0 ${opp.count || 0}</div></div><div class="pseat${me.isTurn ? " turn" : ""} me"><div class="pseat-top"><span class="pn">${esc(me.name || "You")} (you)</span><span class="bjt">${me.score || 0}</span></div></div></div>`;
    if (g.phase === "handover") {
      let rows;
      if (g.lastRound.wash) rows = '<div class="showrow"><span class="sn">Wash \u2014 stock ran out</span><span class="shand">no score</span></div>';
      else rows = `<div class="showrow"><span class="sn">${esc(g.lastRound.kind)} \u2014 ${esc(g.lastRound.scorer)}</span><span class="shand">+${g.lastRound.pts}</span></div>` + g.lastRound.totals.map((t) => `<div class="showrow"><span class="sn">${esc(t.name)}</span><span class="shand">${t.score}</span></div>`).join("");
      app.innerHTML = `<div class="table">${gHead()}${head2}<div class="felt pokerfelt"><div class="pokerinfo">Round over</div><div class="showlist">${rows}</div><div class="actrow"><button class="pbtn call" id="ginnext">Next hand</button></div></div></div>`;
      wireHead(); const n = document.getElementById("ginnext"); if (n) n.onclick = () => emit("ginNext"); return;
    }
    const meldSet = new Set(); (g.myMelds || []).forEach((m) => m.forEach((c) => meldSet.add(c)));
    const selectable = g.canDiscard;
    const myHand = g.myHand.map((code) => `<div class="gfcard${meldSet.has(code) ? " meld" : ""}${ginSel === code ? " sel" : ""}"${selectable ? ` data-gindisc="${code}"` : ""}>${cardInner(code, true)}</div>`).join("");
    let action;
    if (g.canDraw) {
      action = `<div class="gfaction"><div class="gflabel">Draw a card</div><div class="actrow"><button class="pbtn call" id="ginstock">Draw stock (${g.stockCount})</button>${g.discardTop ? `<button class="pbtn" id="gintake">Take ${g.discardTop}</button>` : ""}</div></div>`;
    } else if (g.canDiscard) {
      action = `<div class="gfaction"><div class="gflabel">Deadwood <b>${g.myDeadwood}</b> \u2014 tap a card to discard${ginSel ? ` (<b>${ginSel}</b>)` : ""}</div><div class="actrow"><button class="pbtn call${ginSel ? "" : " disabled"}" id="gindiscard">Discard</button>${g.knockable ? `<button class="pbtn allin${ginSel ? "" : " disabled"}" id="ginknock">Knock</button>` : ""}</div></div>`;
    } else {
      action = `<div class="gfaction idle"><span class="hint">${esc(opp.name || "Opponent")} is thinking\u2026</span></div>`;
    }
    app.innerHTML = `<div class="table">${gHead()}${head2}<div class="felt pokerfelt"><div class="pokerinfo">Discard ${g.discardTop || "\u2014"} \u00b7 Stock ${g.stockCount}</div>${logBox(g.log)}</div><div class="hand pokerhand"><div class="handlabel">YOUR HAND <span>deadwood ${g.myDeadwood} \u00b7 melds shaded</span></div><div class="gfhand">${myHand}</div>${action}</div></div>`;
    wireHead();
    const st = document.getElementById("ginstock"); if (st) st.onclick = () => emit("ginDrawStock");
    const tk = document.getElementById("gintake"); if (tk) tk.onclick = () => emit("ginDrawDiscard");
    app.querySelectorAll("[data-gindisc]").forEach((el) => el.onclick = () => { const c = el.getAttribute("data-gindisc"); ginSel = (ginSel === c ? null : c); renderGin(); });
    const dd = document.getElementById("gindiscard"); if (dd) dd.onclick = () => { if (!ginSel) { toast("Tap a card first"); return; } emit("ginDiscard", { card: ginSel, knock: false }); ginSel = null; };
    const kk = document.getElementById("ginknock"); if (kk) kk.onclick = () => { if (!ginSel) { toast("Tap a card to discard"); return; } emit("ginDiscard", { card: ginSel, knock: true }); ginSel = null; };
  }

  /* ---------------- Big Two ---------------- */
  function renderBigTwo() {
    const g = state.bigtwo;
    if (!g || !g.started) return startScreen("Big Two", state.players.length === 4 ? "Four players \u2014 holder of 3\u2663 leads." : "Big Two needs exactly 4 players.", state.players.length === 4, "bigtwoStart", "Deal &amp; start");
    if (g.phase === "over") {
      const wn = (g.players.find((p) => p.id === g.winner) || {}).name || "";
      const rows = g.players.map((p) => `<div class="showrow"><span class="sn">${esc(p.name)}</span><span class="shand">${p.count} left</span></div>`).join("");
      return overScreen(esc(wn) + " is out \u2014 wins!", rows, state.players.length === 4, "bigtwoStart", "Play again");
    }
    const players = seatRow(g.players, (p) => `<div class="pseat${p.isTurn ? " turn" : ""}${p.isLast ? " leader" : ""}${p.away ? " folded" : ""}"><div class="pseat-top"><span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div><div class="gfstats">\uD83C\uDCA0 ${p.count}</div></div>`);
    const cur = g.current ? `<div class="b2current"><div class="b2type">${g.current.type}</div><div class="b2cards">${g.current.cards.map((c) => `<div class="warcard">${cardInner(c, true)}</div>`).join("")}</div></div>` : '<div class="b2current empty">Table is clear \u2014 lead anything</div>';
    const sel = new Set(multiSel), selectable = g.myTurn;
    const myHand = g.myHand.map((code) => `<div class="gfcard${sel.has(code) ? " sel" : ""}"${selectable ? ` data-b2pick="${code}"` : ""}>${cardInner(code, true)}</div>`).join("");
    let action;
    if (g.myTurn) {
      const canLead = !g.current;
      action = `<div class="gfaction"><div class="gflabel">Your turn \u2014 ${g.firstPlay ? "lead, include 3\u2663" : (canLead ? "lead any combo" : "beat it or pass")}</div><div class="actrow"><button class="pbtn call${multiSel.length ? "" : " disabled"}" id="b2play">Play ${multiSel.length || ""}</button>${canLead ? "" : '<button class="pbtn fold" id="b2pass">Pass</button>'}</div></div>`;
    } else {
      const t = (g.players.find((p) => p.isTurn) || {}).name;
      action = `<div class="gfaction idle"><span class="hint">${t ? esc(t) + "\u2026" : ""}</span></div>`;
    }
    app.innerHTML = `<div class="table">${gHead()}${players}<div class="felt pokerfelt">${cur}${logBox(g.log)}</div><div class="hand pokerhand"><div class="handlabel">YOUR HAND <span>${g.myHand.length} cards</span></div><div class="gfhand">${myHand}</div>${action}</div></div>`;
    wireHead();
    app.querySelectorAll("[data-b2pick]").forEach((el) => el.onclick = () => { const c = el.getAttribute("data-b2pick"); const i = multiSel.indexOf(c); if (i >= 0) multiSel.splice(i, 1); else multiSel.push(c); renderBigTwo(); });
    const pl = document.getElementById("b2play"); if (pl) pl.onclick = () => { if (!multiSel.length) { toast("Pick cards"); return; } emit("bigtwoPlay", { cards: multiSel.slice() }); multiSel = []; };
    const ps = document.getElementById("b2pass"); if (ps) ps.onclick = () => emit("bigtwoPass");
  }

  /* ---------------- Solitaire (Klondike) ---------------- */
  function renderSolitaire() {
    const sv = state.solitaire;
    if (!sv || !sv.started) return startScreen("Solitaire", "Klondike, draw one \u2014 just you.", true, "solStart", "Deal");
    const b = sv.board;
    if (!b) { app.innerHTML = `<div class="table">${gHead()}<div class="felt soonfelt"><div class="sooncard"><div class="hint">Dealing\u2026</div></div></div></div>`; wireHead(); return; }
    if (b.won) return overScreen("You won! \uD83C\uDF89", `<div class="showrow"><span class="sn">Moves</span><span class="shand">${b.moves}</span></div>`, true, "solNew", "New deal");
    const fnd = ["S", "H", "D", "C"].map((su) => {
      const c = b.foundations[su], sel = solSel && solSel.zone === "foundation" && solSel.suit === su;
      return `<div class="solfound ${isRed(su) ? "red" : "black"}${sel ? " sel" : ""}" data-solfsuit="${su}">${c ? cardInner(c, true) : `<span class="solph">${SUIT[su][0]}</span>`}</div>`;
    }).join("");
    const wasteSel = solSel && solSel.zone === "waste";
    const stockWaste = `<div class="solstockwaste"><div class="solpile solstock" id="solstock">${b.stockCount ? '<div class="back"></div>' : '<span class="solph">\u21BB</span>'}<span class="solnum">${b.stockCount}</span></div><div class="solpile solwaste${wasteSel ? " sel" : ""}" id="solwaste">${b.wasteTop ? cardInner(b.wasteTop, true) : '<span class="solph">\u2014</span>'}</div></div>`;
    const tableau = `<div class="soltableau">` + b.tableau.map((col, i) => {
      const cards = col.length ? col.map((x, idx) => {
        if (!x.up) return `<div class="solcard down"><div class="back"></div></div>`;
        const sel = solSel && solSel.zone === "tableau" && solSel.col === i && solSel.index === idx;
        return `<div class="solcard up${sel ? " sel" : ""}" data-fc="${i}" data-fi="${idx}">${cardInner(x.card, true)}</div>`;
      }).join("") : `<div class="solempty">+</div>`;
      return `<div class="solcol" data-solcol="${i}">${cards}</div>`;
    }).join("") + `</div>`;
    const banner = solSel ? `<div class="solbanner">Tap a destination <button class="pbtn fold" id="solcancel">Cancel</button></div>` : `<div class="solbanner hint">Tap a card, then where to move it \u00b7 tap the stock to draw</div>`;
    app.innerHTML = `<div class="table">${gHead()}
      <div class="felt solfelt">
        <div class="soltop"><div class="solfounds">${fnd}</div>${stockWaste}</div>
        ${tableau}
      </div>
      <div class="hand pokerhand"><div class="solbar">${banner}<button class="pbtn" id="solnew">New deal</button></div></div></div>`;
    wireHead();
    const emitMove = (from, to) => { emit("solMove", { from, to }); solSel = null; };
    const stock = document.getElementById("solstock"); if (stock) stock.onclick = () => emit("solDraw");
    const waste = document.getElementById("solwaste"); if (waste) waste.onclick = () => { if (solSel) { if (solSel.zone === "waste") { solSel = null; renderSolitaire(); } } else if (b.wasteTop) { solSel = { zone: "waste" }; renderSolitaire(); } };
    app.querySelectorAll("[data-solfsuit]").forEach((el) => el.onclick = () => { const su = el.getAttribute("data-solfsuit"); if (solSel) emitMove(solSel, { zone: "foundation", suit: su }); else if (b.foundations[su]) { solSel = { zone: "foundation", suit: su }; renderSolitaire(); } });
    app.querySelectorAll(".solcol").forEach((col) => { col.onclick = (e) => { const i = +col.getAttribute("data-solcol"); const cardEl = e.target.closest(".solcard.up"); if (solSel) emitMove(solSel, { zone: "tableau", col: i }); else if (cardEl) { solSel = { zone: "tableau", col: +cardEl.getAttribute("data-fc"), index: +cardEl.getAttribute("data-fi") }; renderSolitaire(); } }; });
    const cancel = document.getElementById("solcancel"); if (cancel) cancel.onclick = () => { solSel = null; renderSolitaire(); };
    const nw = document.getElementById("solnew"); if (nw) nw.onclick = () => emit("solNew");
  }

  function renderSheet() {
    let body = "";
    const T = (t) => `<h3 class="sheettitle">${t}</h3>`;
    const R = (act, label, danger) => `<button class="row${danger ? " danger" : ""}" data-row="${act}">${label}</button>`;
    if (sheet.kind === "deck") {
      const others = state.players.filter((p) => !p.me);
      body = T("Deck \u00b7 " + state.deckCount + " cards")
        + R("shuffle", "\uD83D\uDD00 Shuffle deck")
        + R("dealMe", "\u2935\uFE0F Deal a card to my hand")
        + R("dealTable", "\uD83C\uDFB4 Deal a card to the table (face down)")
        + others.map((p) => R("dealTo:" + p.id, "\u27A1\uFE0F Deal a card to " + esc(p.name))).join("")
        + (others.length ? R("dealRound", "\uD83C\uDCCF Deal one card to everyone") : "")
        + (state.players.length ? R("dealMulti", "\uD83D\uDD22 Deal several cards to a player\u2026") : "");
    } else if (sheet.kind === "dealN") {
      const counts = [1, 2, 3, 4, 5, 7];
      body = T("Deal how many, to whom?")
        + '<div class="countrow">' + counts.map((nn) => `<button class="countbtn${nn === dealN ? " on" : ""}" data-row="setN:${nn}">${nn}</button>`).join("") + '</div>'
        + state.players.map((p) => R("dealNto:" + p.id, "\u27A1\uFE0F Deal " + dealN + " to " + esc(p.name) + (p.me ? " (me)" : ""))).join("");
    }
    else if (sheet.kind === "table") { const c = sheet.card; body = T("Table card") + R("flip", c.faceUp ? "\uD83D\uDD3D Turn face down" : "\uD83D\uDD3C Turn face up (everyone sees it)") + (!c.faceUp ? R("peek", c.peekedByMe ? "\uD83D\uDE48 Stop peeking" : "\uD83D\uDC41 Peek privately") : "") + R("take", "\u270B Take into my hand") + R("toDeck", "\u21A9\uFE0F Return to deck"); }
    else if (sheet.kind === "hand") body = T("Your card") + R("playUp", "\uD83C\uDFB4 Play to table, face up") + R("playDown", "\uD83C\uDCA0 Play to table, face down") + R("handDeck", "\u21A9\uFE0F Return to deck");
    else if (sheet.kind === "player") { const p = state.players.find((x) => x.id === sheet.pid); body = T(esc(p ? p.name : "")) + R("dealPlayer", "\u2935\uFE0F Deal a card to " + esc(p ? p.name : "")); }
    else if (sheet.kind === "menu") {
      const mode = currentMode();
      const isFree = mode === "freeform";
      const chips = mode === "poker" || mode === "blackjack";
      body = T(esc(gameById(mode).name))
        + menuSection("Play")
        + mrow("opengames", "games", "Games", { sub: esc(gameById(mode).name) })
        + (chips ? mrow("openchips", "chips", "Add chips", { sub: "Any player", chev: false }) : "")
        + menuSection("Appearance")
        + mrow("openrooms", "table", "Table theme", { sub: esc(roomName()) })
        + mrow("openthemes", "cards", "Card theme", { sub: esc(cardThemeName()) })
        + (isFree ? menuSection("Deck")
          + mrow("shuffle", "shuffle", "Shuffle deck", { chev: false })
          + mrow("collect", "collect", "Collect all & reshuffle", { chev: false }) : "")
        + menuSection("Help")
        + mrow("howto", "info", "How to play", { chev: false })
        + menuSection("")
        + mrow("leave", "leave", "Leave table", { danger: true, chev: false });
    }
    else if (sheet.kind === "pmenu") {
      body = T("Texas Hold'em")
        + menuSection("Play")
        + mrow("opengames", "games", "Games", { sub: "Texas Hold'em" })
        + mrow("openchips", "chips", "Add chips", { sub: "Any player", chev: false })
        + menuSection("Appearance")
        + mrow("openrooms", "table", "Table theme", { sub: esc(roomName()) })
        + mrow("openthemes", "cards", "Card theme", { sub: esc(cardThemeName()) })
        + menuSection("Help")
        + mrow("howto", "info", "How to play", { chev: false })
        + menuSection("")
        + mrow("leave", "leave", "Leave table", { danger: true, chev: false });
    }
    else if (sheet.kind === "games") {
      body = T("Choose a game");
      for (const cat of CATS) {
        const gs = GAMES.filter((g) => g.cat === cat);
        if (!gs.length) continue;
        body += `<div class="gamecat">${cat}</div>`;
        body += gs.map((g) => {
          const cur = g.id === currentMode();
          const tag = g.status === "ready" ? `<span class="tag ready">${cur ? "Playing" : "Play"}</span>` : '<span class="tag soon">Soon</span>';
          return `<button class="row gamerow" data-row="game:${g.id}"><span class="grow-main"><span class="gname">${esc(g.name)}</span><span class="gmeta">${playersLabel(g)}</span></span>${tag}</button>`;
        }).join("");
      }
    }
    else if (sheet.kind === "game") {
      const g = gameById(sheet.gid); const cur = g.id === currentMode();
      body = T(esc(g.name)) + `<div class="gmeta2">${g.cat} \u00b7 ${playersLabel(g)}</div>`
        + `<ol class="rules">${g.rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ol>`
        + (cur ? '<div class="row disabled">\u2713 Currently playing</div>'
          : g.status === "ready" ? R("play:" + g.id, "\u25B6 Play this game")
          : '<div class="soonnote">\uD83D\uDEA7 Coming soon</div>')
        + R("backgames", "\u2039 All games");
    }
    else if (sheet.kind === "themes") {
      body = T("Card theme") + '<div class="themegrid">' + THEMES.map((th) => {
        const t = th.t, on = th.id === theme;
        return `<button class="themeopt${on ? " on" : ""}" data-row="settheme:${th.id}">
          <span class="swatch"><span class="sw-back" style="background:${t.backBg};border-color:${t.backBorder}"></span><span class="sw-face" style="background:${t.faceBg};border-color:${t.faceBorder};font-family:${t.font || "'Fraunces',serif"}"><b style="color:${t.black}">A</b><b style="color:${t.red}">\u2665</b></span></span>
          <span class="themename">${esc(th.name)}</span></button>`;
      }).join("") + "</div>";
    }
    else if (sheet.kind === "rooms") {
      body = T("Table theme") + '<div class="roomgrid">' + ROOMS.map((rm) => {
        const v = rm.v, on = rm.id === room;
        const sw = `--rs-felt:${v.felt};--rs-rail:${v.rail};--rs-b1:${v.b1};--rs-b2:${v.b2};--rs-b3:${v.b3}`;
        return `<button class="roomopt${on ? " on" : ""}" data-row="setroom:${rm.id}"><span class="roomsw" style="${sw}"></span><span class="roomname">${esc(rm.name)}</span></button>`;
      }).join("") + "</div>";
    }
    else if (sheet.kind === "addchips") {
      const amts = [100, 500, 1000];
      body = T("Add chips")
        + '<div class="countrow">' + amts.map((a) => `<button class="countbtn${a === chipAmt ? " on" : ""}" data-row="setchip:${a}">${a}</button>`).join("") + '</div>'
        + (((state.poker && state.poker.players) || (state.blackjack && state.blackjack.players) || state.players) || []).map((p) => R("givechips:" + p.id, "\uD83E\uDE99 Give " + chipAmt + " to " + esc(p.name) + (p.me ? " (you)" : ""))).join("");
    }

    let scrim = document.getElementById("scrim");
    if (!scrim) { scrim = document.createElement("div"); scrim.id = "scrim"; scrim.className = "scrim"; document.body.appendChild(scrim); }
    scrim.innerHTML = `<div class="sheet" id="sheetinner"><div class="sheethead"><div class="grabber"></div><button class="sheetclose" id="sheetclose" aria-label="Close">\u2715</button></div>${body}</div>`;
    scrim.onclick = (e) => { if (e.target === scrim) closeSheet(); };
    const cb = document.getElementById("sheetclose"); if (cb) cb.onclick = closeSheet;
    scrim.querySelectorAll("[data-row]").forEach((el) => (el.onclick = () => handleRow(el.dataset.row)));
  }
  function closeSheet() { sheet = null; const s = document.getElementById("scrim"); if (s) s.remove(); }

  function handleRow(act) {
    const c = sheet.card, code = sheet.code, pid = sheet.pid;
    if (act === "opengames") { sheet = { kind: "games" }; renderSheet(); return; }
    if (act === "openthemes") { sheet = { kind: "themes" }; renderSheet(); return; }
    if (act === "openrooms") { sheet = { kind: "rooms" }; renderSheet(); return; }
    if (act === "howto") { sheet = { kind: "game", gid: currentMode() }; renderSheet(); return; }
    if (act.indexOf("game:") === 0) { sheet = { kind: "game", gid: act.slice(5) }; renderSheet(); return; }
    if (act === "backgames") { sheet = { kind: "games" }; renderSheet(); return; }
    if (act.indexOf("play:") === 0) { emit("setMode", { mode: act.slice(5) }); closeSheet(); return; }
    if (act.indexOf("settheme:") === 0) { applyTheme(act.slice(9)); renderSheet(); return; }
    if (act.indexOf("setroom:") === 0) { applyRoom(act.slice(8)); renderSheet(); return; }
    if (act.indexOf("dealTo:") === 0) { emit("dealToPlayer", { pid: act.slice(7) }); closeSheet(); render(); return; }
    if (act.indexOf("setN:") === 0) { dealN = parseInt(act.slice(5)) || 1; renderSheet(); return; }
    if (act.indexOf("dealNto:") === 0) { emit("dealMany", { pid: act.slice(8), n: dealN }); closeSheet(); render(); return; }
    if (act === "dealMulti") { sheet = { kind: "dealN" }; renderSheet(); return; }
    if (act.indexOf("addchips:") === 0) { emit("addChips", { amount: parseInt(act.slice(9)) || 100 }); closeSheet(); render(); return; }
    if (act === "openchips") { sheet = { kind: "addchips" }; renderSheet(); return; }
    if (act.indexOf("setchip:") === 0) { chipAmt = parseInt(act.slice(8)) || 500; renderSheet(); return; }
    if (act.indexOf("givechips:") === 0) { emit("addChips", { amount: chipAmt, pid: act.slice(10) }); closeSheet(); render(); return; }
    const map = {
      shuffle: () => { emit("shuffle"); shuf = true; },
      dealMe: () => emit("dealToMe"),
      dealTable: () => emit("dealToTable"),
      dealPlayer: () => emit("dealToPlayer", { pid }),
      dealRound: () => emit("dealRound"),
      pokerOn: () => emit("pokerOn"),
      pokerOff: () => emit("pokerOff"),
      flip: () => emit("flip", { id: c.id }),
      peek: () => emit("peek", { id: c.id }),
      take: () => emit("takeFromTable", { id: c.id }),
      toDeck: () => emit("tableToDeck", { id: c.id }),
      playUp: () => emit("playFromHand", { code, faceUp: true }),
      playDown: () => emit("playFromHand", { code, faceUp: false }),
      handDeck: () => emit("handToDeck", { code }),
      collect: () => { emit("collectAll"); shuf = true; },
      leave: () => { emit("leave"); me = null; saveMe(); state = null; },
    };
    (map[act] || (() => {}))();
    closeSheet();
    render();
  }

  let toastT;
  function toast(m) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 1800);
  }

  window.addEventListener("resize", () => { if (me && state && !dragging) layoutHand(); });
  applyTheme(theme);
  applyRoom(room);
  render();
})();
  </script>
</body>
</html>
