<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#0e3b2b" />
<title>Card Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; }
html, body, #app { height: 100%; }
body { font-family: 'Outfit', system-ui, sans-serif; color: #f3ead4;
  background: radial-gradient(120% 90% at 50% -10%, #16523c 0%, #0e3b2b 45%, #08291e 100%); }
body::before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px); background-size:4px 4px; }

/* home */
.home { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; }
.home-inner { width:100%; max-width:380px; text-align:center; }
.suits { letter-spacing:.5em; color:#d9b35c; font-size:18px; margin-bottom:14px; opacity:.85; }
.title { font-family:'Fraunces',serif; font-weight:700; font-size:46px; line-height:1; margin-bottom:10px;
  background:linear-gradient(180deg,#fff5dd,#d9b35c); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub { color:#bcd6c6; font-size:14.5px; line-height:1.5; margin-bottom:26px; }
.label { display:block; text-align:left; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8fb6a1; margin:16px 2px 7px; }
.input { width:100%; padding:14px 16px; border-radius:13px; border:1px solid rgba(217,179,92,.28);
  background:rgba(0,0,0,.22); color:#fff; font-size:16px; font-family:inherit; outline:none; }
.input:focus { border-color:#d9b35c; }
.code-in { letter-spacing:.35em; text-align:center; font-weight:600; font-size:20px; }
.btn { width:100%; padding:15px; border-radius:13px; font-family:inherit; font-size:15.5px; font-weight:600;
  border:none; cursor:pointer; margin-top:12px; transition:transform .08s; }
.btn:active { transform:scale(.985); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.primary { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; box-shadow:0 6px 18px rgba(0,0,0,.3); }
.btn.outline { background:transparent; color:#f3ead4; border:1px solid rgba(243,234,212,.28); }
.btn.ghost { background:transparent; color:#9fc0ad; }
.err { margin-top:14px; color:#ffb4ab; font-size:13.5px; }
.foot { margin-top:24px; color:#6f9381; font-size:12px; line-height:1.5; }

/* table */
.table { min-height:100vh; display:flex; flex-direction:column; }
.top { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px; }
.codebox { display:flex; flex-direction:column; line-height:1; cursor:pointer; }
.codelabel { font-size:9.5px; letter-spacing:.18em; color:#7fa691; }
.codeval { font-family:'Fraunces',serif; font-weight:700; font-size:27px; letter-spacing:.16em; color:#fff5dd; margin-top:3px; }
.copy { font-size:10px; color:#5f8472; margin-top:3px; }
.iconbtn { background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.1); color:#f3ead4; width:40px; height:40px; border-radius:11px; font-size:20px; cursor:pointer; }
.players { display:flex; gap:8px; padding:4px 16px 10px; flex-wrap:wrap; }
.waiting { color:#7fa691; font-size:13px; padding:4px 2px; }
.pchip { display:flex; align-items:center; gap:7px; background:rgba(0,0,0,.24); border:1px solid rgba(255,255,255,.09); border-radius:20px; padding:7px 12px; color:#eadfc4; font-size:13px; font-family:inherit; cursor:pointer; }
.pchip.away { opacity:.45; }
.pchip.away .pdot { background:#8a8a8a; box-shadow:none; }
.pdot { width:7px; height:7px; border-radius:50%; background:#6fd39a; box-shadow:0 0 6px #6fd39a; }
.pname { font-weight:600; } .pcount { color:#bca; font-size:12px; }
.felt { flex:1; display:flex; flex-direction:column; padding:8px 12px; }
.deck { position:absolute; top:12px; left:12px; z-index:1000; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
.deckstack { width:56px; height:80px; border-radius:8px; position:relative;
  background:repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 6px,#8c2727 6px,#8c2727 12px);
  border:2px solid #e6c068; box-shadow:0 3px 0 #5d1717,0 7px 0 #4a1212,0 12px 18px rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; }
.deckstack::after { content:''; position:absolute; inset:6px; border:1px solid rgba(230,192,104,.5); border-radius:5px; }
.deckcount { font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:#fff5dd; z-index:1; text-shadow:0 2px 4px rgba(0,0,0,.6); }
.decklabel { font-size:9px; letter-spacing:.16em; color:#9fc0ad; }
.deck.shuf .deckstack { animation:shuf .55s ease; }
@keyframes shuf { 0%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-7px) rotate(-4deg)} 55%{transform:translateX(7px) rotate(4deg)} 80%{transform:translateX(-3px) rotate(-1deg)} 100%{transform:none} }
.tablearea { position:relative; width:100%; flex:1; min-height:52vh; padding:14px; border-radius:18px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%, rgba(0,0,0,.16), rgba(0,0,0,.28)); border:1px solid rgba(255,255,255,.06); box-shadow:inset 0 2px 14px rgba(0,0,0,.35); }
.tablecard { position:absolute; width:62px; height:88px; transform:translate(-50%,-50%); cursor:grab; touch-action:none; border-radius:7px; transition:box-shadow .12s, transform .06s; }
.tablecard .face, .tablecard .back { width:100%; height:100%; }
.tablecard.dragging { cursor:grabbing; transition:none; transform:translate(-50%,-50%) scale(1.06); box-shadow:0 16px 30px rgba(0,0,0,.55); }
.tablecard.peeking { box-shadow:0 0 0 2px #d9b35c, 0 10px 18px rgba(0,0,0,.45); }
.emptytable, .emptyhand { color:#6f9381; font-size:13px; align-self:center; margin:auto; }

/* cards */
.card { padding:0; border:none; background:none; cursor:pointer; border-radius:7px; transition:transform .12s; position:relative; display:inline-block; }
.card:active { transform:translateY(-3px) scale(1.02); }
.card.peeking { transform:translateY(-6px); box-shadow:0 0 0 2px #d9b35c,0 10px 18px rgba(0,0,0,.45); }
.face, .back { width:100%; height:100%; border-radius:7px; position:relative; }
.face { background:linear-gradient(170deg,#fbf7ec,#efe7d2); border:1px solid #cbb98e; box-shadow:0 3px 8px rgba(0,0,0,.35); }
.back { background:repeating-linear-gradient(45deg,#7a1f1f,#7a1f1f 5px,#8c2727 5px,#8c2727 10px); border:2px solid #e6c068; box-shadow:0 3px 8px rgba(0,0,0,.4); }
.back::after { content:''; position:absolute; inset:5px; border:1px solid rgba(230,192,104,.55); border-radius:4px; }
.corner { position:absolute; display:flex; flex-direction:column; align-items:center; line-height:.95; font-weight:700; font-family:'Fraunces',serif; }
.corner .r { font-size:15px; } .corner .s { font-size:12px; }
.corner.tl { top:5px; left:6px; } .corner.br { bottom:5px; right:6px; transform:rotate(180deg); }
.pip { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; }
.eye { position:absolute; top:-9px; right:-7px; font-size:14px; background:#0e3b2b; border:1px solid #d9b35c; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }

/* hand */
.hand { background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.4)); border-top:1px solid rgba(217,179,92,.25); padding:12px 14px 18px; }
.handlabel { font-size:11px; letter-spacing:.13em; color:#9fc0ad; margin-bottom:9px; }
.handlabel span { text-transform:none; letter-spacing:0; color:#6f9381; font-size:11px; }
.handcards { display:flex; justify-content:center; align-items:center; min-height:142px; padding:6px 8px 8px; overflow:hidden; }
.handcard { flex:0 0 auto; width:86px; height:124px; padding:0; border:none; background:none; border-radius:8px; cursor:grab; touch-action:none; position:relative; transition:transform .08s; }
.handcard .face, .handcard .back { width:100%; height:100%; box-shadow:0 2px 7px rgba(0,0,0,.45); }
.handcard.dragging { cursor:grabbing; transition:none; z-index:20; box-shadow:0 16px 28px rgba(0,0,0,.55); }
.countrow { display:flex; gap:8px; margin:0 4px 12px; }
.countbtn { flex:1; padding:13px 0; border-radius:11px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#f3ead4; font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; }
.countbtn.on { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; border-color:#e6c068; }

/* poker mode */
.pokerplayers { display:flex; gap:8px; padding:4px 12px 8px; flex-wrap:wrap; }
.pseat { background:rgba(0,0,0,.26); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:7px 10px; min-width:96px; }
.pseat.turn { border-color:#e6c068; box-shadow:0 0 0 1px #e6c068, 0 0 12px rgba(230,192,104,.35); }
.pseat.folded { opacity:.45; }
.pseat-top { display:flex; align-items:center; gap:5px; margin-bottom:3px; }
.pn { font-size:13px; font-weight:600; color:#eadfc4; }
.badge { font-size:9px; font-weight:700; padding:1px 5px; border-radius:6px; background:rgba(255,255,255,.12); color:#f3ead4; letter-spacing:.04em; }
.badge.btn { background:#e6c068; color:#3a2a06; }
.pchips { font-size:13px; color:#fff5dd; font-weight:600; }
.pbet { font-size:11px; color:#d9b35c; margin-top:2px; }
.pstatus { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#9fc0ad; margin-top:2px; }
.pokerfelt { gap:12px; align-items:center; justify-content:flex-start; }
.pokerinfo { font-size:13px; color:#cfe3d6; margin-top:6px; }
.pokerinfo b { color:#fff5dd; letter-spacing:.08em; }
.board { display:flex; gap:7px; justify-content:center; min-height:74px; align-items:center; margin-top:6px; }
.bcard { width:50px; height:70px; }
.bcard .face, .bcard .back { width:100%; height:100%; }
.bslot { width:50px; height:70px; border-radius:6px; border:1px dashed rgba(255,255,255,.14); }
.pcenter { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:8px; text-align:center; }
.result { font-family:'Fraunces',serif; font-size:18px; color:#fff5dd; }
.showns { font-size:12px; color:#9fc0ad; }
.hint { font-size:13px; color:#8fb6a1; }
.pokerhand { display:flex; flex-direction:column; gap:10px; align-items:center; }
.holecards { display:flex; gap:8px; align-items:center; min-height:96px; }
.holecard { width:68px; height:96px; }
.holecard .face, .holecard .back { width:100%; height:100%; }
.foldedtag { font-size:12px; color:#ffb4ab; align-self:center; }
.actionbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; width:100%; }
.actionbar.idle { min-height:0; }
.pbtn { padding:12px 14px; border-radius:11px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06); color:#f3ead4; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
.pbtn.fold { color:#ffb4ab; }
.pbtn.call { background:linear-gradient(180deg,#e6c068,#cf9f3f); color:#3a2a06; border-color:#e6c068; }
.pbtn.allin { color:#ffd9a0; }
.pbtn.add { background:transparent; color:#9fc0ad; border-color:rgba(159,192,173,.4); }
.raisebox { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.25); border-radius:11px; padding:3px; }
.pbtn.step { padding:10px 13px; }
.ramt { min-width:46px; text-align:center; font-weight:700; color:#fff5dd; }
.pbtn.raise { background:rgba(217,179,92,.22); border-color:#d9b35c; }

/* sheet / toast */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.sheet { width:100%; max-width:440px; background:#0e3b2b; border:1px solid rgba(217,179,92,.3); border-bottom:none; border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.5); animation:rise .2s ease; }
@keyframes rise { from{transform:translateY(30px)} to{transform:none} }
.sheettitle { font-family:'Fraunces',serif; font-size:18px; margin:2px 4px 14px; color:#fff5dd; }
.row { display:block; width:100%; text-align:left; padding:15px 16px; border-radius:13px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); color:#f3ead4; font-family:inherit; font-size:15.5px; cursor:pointer; margin-bottom:9px; }
.row.danger { color:#ffb4ab; }
.toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:60; background:rgba(8,41,30,.95); border:1px solid #d9b35c; color:#fff5dd; padding:10px 18px; border-radius:30px; font-size:13.5px; }
</style></head><body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
/* Card Lobby — client. The server is authoritative; we render whatever
   `state` it sends and emit intents on tap. */
(function () {
  const socket = io();
  const app = document.getElementById("app");

  const SUIT = { S: ["\u2660", "#1a1a1a"], H: ["\u2665", "#b3261e"], D: ["\u2666", "#b3261e"], C: ["\u2663", "#1a1a1a"] };
  const RLAB = { T: "10" };
  let me = null;          // {name, code}
  let state = null;       // latest view from server
  let sheet = null;       // open action sheet
  let shuf = false;
  let dragging = false;   // true while this client is dragging a table card
  let connected = false;  // socket connection status
  let dealN = 2;          // chosen count for "deal several to a player"
  let raiseTo = 0;        // poker raise stepper value
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // stable per-device id so a reconnect restores the same seat + hand
  const clientId = (() => {
    try {
      let c = localStorage.getItem("cl_cid");
      if (!c) { c = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("cl_cid", c); }
      return c;
    } catch (_) { return Math.random().toString(36).slice(2); }
  })();
  function saveMe() { try { me ? localStorage.setItem("cl_me", JSON.stringify(me)) : localStorage.removeItem("cl_me"); } catch (_) {} }
  function loadMe() { try { const r = localStorage.getItem("cl_me"); return r ? JSON.parse(r) : null; } catch (_) { return null; } }
  me = loadMe(); // resume a table across reloads / app switches

  /* ---- socket ---- */
  // (re)connecting: if we were in a lobby, rejoin it (same clientId => same seat). Otherwise show home.
  socket.on("connect", () => {
    connected = true;
    if (me && me.code) {
      emit("join", { code: me.code, name: me.name, clientId }, (r) => {
        if (r && r.ok) render();
        else { me = null; saveMe(); renderHome(); }
      });
    } else renderHome();
  });
  socket.on("disconnect", () => { connected = false; if (!me) renderHome(); });
  socket.on("connect_error", () => { connected = false; if (!me) renderHome(); }); // free server may be waking
  socket.on("state", (s) => { state = s; if (dragging) return; render(); }); // don't yank a card mid-drag
  // lightweight live position from another player's drag — patch just that card, no full re-render
  socket.on("cardMoved", ({ id, x, y } = {}) => {
    if (state) { const c = state.table.find((t) => t.id === id); if (c) { c.x = x; c.y = y; } }
    const el = document.querySelector('.tablecard[data-id="' + id + '"]');
    if (el) { el.style.left = x * 100 + "%"; el.style.top = y * 100 + "%"; }
  });

  function emit(ev, ...rest) { socket.emit(ev, ...rest); } // pass through ack callbacks too

  /* ---- card markup ---- */
  function cardInner(code, show) {
    if (!show) return '<div class="back"></div>';
    const r = code.slice(0, -1), s = code.slice(-1);
    const [sym, col] = SUIT[s];
    const rl = RLAB[r] || r;
    return `<div class="face" style="color:${col}">
        <div class="corner tl"><span class="r">${rl}</span><span class="s">${sym}</span></div>
        <div class="pip">${sym}</div>
        <div class="corner br"><span class="r">${rl}</span><span class="s">${sym}</span></div></div>`;
  }
  function cardEl(code, faceUp, opts = {}) {
    const size = opts.size || "md";
    const dims = { sm: [44, 62], md: [62, 88], lg: [78, 112] }[size];
    const inner = cardInner(code, faceUp || opts.peeking);
    const eye = opts.peekedByName ? `<div class="eye" title="${esc(opts.peekedByName)} is peeking">\uD83D\uDC41</div>` : "";
    return `<button class="card${opts.peeking ? " peeking" : ""}" style="width:${dims[0]}px;height:${dims[1]}px" data-act="${opts.act || ""}" data-id="${opts.id || ""}" data-code="${opts.code || ""}">${inner}${eye}</button>`;
  }

  /* ---- render ---- */
  function render() {
    if (!me) return renderHome();
    if (!state) { app.innerHTML = '<div class="home"><div class="home-inner"><div class="suits">\u2660 \u2665 \u2666 \u2663</div><p class="sub">Connecting\u2026</p></div></div>'; return; }
    if (state.poker && state.poker.on) renderPoker();
    else renderTable();
    if (sheet) renderSheet();
  }

  function renderHome(err) {
    const joining = renderHome._mode === "join";
    app.innerHTML = `
    <div class="home"><div class="home-inner">
      <div class="suits">\u2660 \u2665 \u2666 \u2663</div>
      <h1 class="title">Card Lobby</h1>
      <p class="sub">A shared table for playing cards with friends, wherever they are.</p>
      <label class="label">Your name</label>
      <input class="input" id="name" maxlength="16" placeholder="e.g. Ada" value="${esc(renderHome._name || "")}" />
      ${joining ? `
        <label class="label">Lobby code</label>
        <input class="input code-in" id="code" maxlength="6" placeholder="ABC123" />
        <button class="btn primary" id="dojoin"${connected ? "" : " disabled"}>Join table</button>
        <button class="btn ghost" id="back">Back</button>` : `
        <button class="btn primary" id="create"${connected ? "" : " disabled"}>Create a table</button>
        <button class="btn outline" id="dojoinmode"${connected ? "" : " disabled"}>Join with a code</button>`}
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      ${connected
        ? '<p class="foot">Share this site\u2019s link, then friends enter your code.</p>'
        : '<p class="foot">Connecting to the server\u2026 the first wake-up can take up to a minute on the free plan.</p>'}
    </div></div>`;

    const nameEl = document.getElementById("name");
    nameEl.oninput = () => (renderHome._name = nameEl.value);
    const need = () => { const n = (renderHome._name || "").trim(); if (!n) { renderHome(false); toast("Enter a name first"); } return n; };
    if (document.getElementById("create")) document.getElementById("create").onclick = () => { const n = need(); if (n) emit("create", { name: n, clientId }, (r) => { if (r && r.ok) { me = { name: n, code: r.code }; saveMe(); render(); } }); };
    if (document.getElementById("dojoinmode")) document.getElementById("dojoinmode").onclick = () => { if (need()) { renderHome._mode = "join"; renderHome(); } };
    if (document.getElementById("back")) document.getElementById("back").onclick = () => { renderHome._mode = null; renderHome(); };
    if (document.getElementById("code")) document.getElementById("code").oninput = (e) => (e.target.value = e.target.value.toUpperCase());
    if (document.getElementById("dojoin")) document.getElementById("dojoin").onclick = () => {
      const n = need(); const c = (document.getElementById("code").value || "").trim();
      if (n && c.length >= 4) emit("join", { name: n, code: c, clientId }, (r) => { if (r && r.ok) { me = { name: n, code: r.code }; saveMe(); render(); } else renderHome(r && r.error); });
    };
  }

  function renderTable() {
    const others = state.players.filter((p) => !p.me);
    const mine = state.players.find((p) => p.me) || { count: 0 };
    app.innerHTML = `
    <div class="table">
      <header class="top">
        <div class="codebox" id="codebox">
          <span class="codelabel">TABLE CODE</span>
          <span class="codeval">${esc(state.code)}</span>
          <span class="copy">tap to copy</span>
        </div>
        <button class="iconbtn" id="menu">\u22EF</button>
      </header>
      <div class="players">
        ${others.length === 0 ? '<div class="waiting">Waiting for friends to join\u2026</div>' : ""}
        ${others.map((p) => `<button class="pchip${p.away ? " away" : ""}" data-act="player" data-id="${p.id}"><span class="pdot"></span><span class="pname">${esc(p.name)}</span><span class="pcount">\uD83C\uDCA0 ${p.count}</span></button>`).join("")}
      </div>
      <div class="felt">
        <div class="tablearea">
          <div class="deck${shuf ? " shuf" : ""}" id="deck"><div class="deckstack"><span class="deckcount">${state.deckCount}</span></div><span class="decklabel">DECK</span></div>
          ${state.table.length === 0 ? '<div class="emptytable">Dealt cards land here \u00b7 drag to arrange</div>' : ""}
          ${state.table.map((c) => {
            const show = c.faceUp || c.peekedByMe;
            const eye = !c.peekedByMe && c.peekedByName ? `<div class="eye" title="${esc(c.peekedByName)} is peeking">\uD83D\uDC41</div>` : "";
            const x = c.x != null ? c.x : 0.5, y = c.y != null ? c.y : 0.45;
            return `<div class="tablecard${c.peekedByMe ? " peeking" : ""}" data-id="${c.id}" style="left:${x * 100}%;top:${y * 100}%;z-index:${c.z || 1}">${cardInner(c.code || "", show)}${eye}</div>`;
          }).join("")}
        </div>
      </div>
      <div class="hand">
        <div class="handlabel">YOUR HAND <span>${mine.count} cards \u00b7 only you can see these \u00b7 drag to reorder</span></div>
        <div class="handcards">
          ${state.myHand.length === 0 ? '<div class="emptyhand">No cards yet \u2014 tap the deck to deal</div>' : ""}
          ${state.myHand.map((code) => `<button class="handcard" data-code="${code}">${cardInner(code, true)}</button>`).join("")}
        </div>
      </div>
    </div>`;
    shuf = false;

    document.getElementById("codebox").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
    document.getElementById("menu").onclick = () => { sheet = { kind: "menu" }; renderSheet(); };
    document.getElementById("deck").onclick = () => { sheet = { kind: "deck" }; renderSheet(); };
    app.querySelectorAll("[data-act]").forEach((el) => {
      el.onclick = () => {
        const act = el.dataset.act;
        if (act === "player") sheet = { kind: "player", pid: el.dataset.id };
        else return;
        renderSheet();
      };
    });
    const area = app.querySelector(".tablearea");
    app.querySelectorAll(".tablecard").forEach((el) => attachTableCard(el, el.dataset.id, area));
    const hc = app.querySelector(".handcards");
    app.querySelectorAll(".handcard").forEach((el) => attachHandCard(el, el.dataset.code, hc));
    layoutHand();
  }

  /* fan the hand so every card stays visible (overlap when there are too many to lay flat) */
  function layoutHand() {
    const wrap = app.querySelector(".handcards");
    if (!wrap) return;
    const cards = Array.from(wrap.querySelectorAll(".handcard"));
    if (!cards.length) return;
    const cw = 86, gap = 10;
    const avail = Math.max(200, wrap.clientWidth - 12);
    const n = cards.length;
    const step = (n * cw + (n - 1) * gap <= avail) ? cw + gap : Math.max(24, (avail - cw) / (n - 1));
    cards.forEach((c, i) => { c.style.marginLeft = i === 0 ? "0px" : (step - cw) + "px"; c.style.zIndex = String(i + 1); });
  }

  /* drag-to-position for a table card; a tap (no real movement) opens its menu */
  function attachTableCard(el, id, area) {
    let down = false, moved = false, lastX = 0, lastY = 0, last = 0;
    el.addEventListener("pointerdown", (e) => {
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      down = true; moved = false;
      el._sx = e.clientX; el._sy = e.clientY;
    });
    el.addEventListener("pointermove", (e) => {
      if (!down) return;
      if (!moved && Math.hypot(e.clientX - el._sx, e.clientY - el._sy) < 6) return;
      moved = true; dragging = true;
      el.classList.add("dragging"); el.style.zIndex = 9999;
      const r = area.getBoundingClientRect();
      lastX = Math.min(0.97, Math.max(0.03, (e.clientX - r.left) / r.width));
      lastY = Math.min(0.94, Math.max(0.06, (e.clientY - r.top) / r.height));
      el.style.left = lastX * 100 + "%"; el.style.top = lastY * 100 + "%";
      const now = Date.now();
      if (now - last > 70) { last = now; emit("dragMove", { id, x: lastX, y: lastY }); } // relay so others see it glide
    });
    const finish = (e) => {
      if (!down) return;
      down = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      if (moved) {
        emit("dropCard", { id, x: lastX, y: lastY });
        const c = state && state.table.find((t) => t.id === id);
        if (c) { c.x = lastX; c.y = lastY; } // optimistic, so it doesn't flicker before the broadcast
        dragging = false;
      } else {
        sheet = { kind: "table", card: state.table.find((t) => t.id === id) };
        renderSheet();
      }
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  /* drag a hand card: release over the table to PLAY it there (face up), or within the
     hand to REORDER. A quick tap opens its menu. The card floats so it can leave the hand strip. */
  function attachHandCard(el, code, container) {
    let down = false, moved = false, sx = 0, sy = 0, px = 0, py = 0, ghost = null;
    const lift = () => {
      const r = el.getBoundingClientRect();
      ghost = el.cloneNode(true);
      Object.assign(ghost.style, {
        position: "fixed", left: px + "px", top: py + "px", width: r.width + "px", height: r.height + "px",
        margin: "0", transform: "translate(-50%,-50%) scale(1.08)", pointerEvents: "none", zIndex: "99999",
        boxShadow: "0 18px 32px rgba(0,0,0,.6)", borderRadius: "8px",
      });
      document.body.appendChild(ghost);
      el.style.opacity = "0.25";
    };
    el.addEventListener("pointerdown", (e) => {
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      down = true; moved = false; sx = e.clientX; sy = e.clientY; px = e.clientX; py = e.clientY;
    });
    el.addEventListener("pointermove", (e) => {
      if (!down) return;
      px = e.clientX; py = e.clientY;
      if (!moved && Math.hypot(px - sx, py - sy) < 6) return;
      if (!moved) { moved = true; dragging = true; lift(); }
      if (ghost) { ghost.style.left = px + "px"; ghost.style.top = py + "px"; }
    });
    const finish = (e) => {
      if (!down) return; down = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      if (ghost) { ghost.remove(); ghost = null; }
      el.style.opacity = "";
      if (!moved) { sheet = { kind: "hand", code }; renderSheet(); return; }
      const area = document.querySelector(".tablearea");
      const tr = area ? area.getBoundingClientRect() : null;
      if (tr && px >= tr.left && px <= tr.right && py >= tr.top && py <= tr.bottom) {
        // dropped on the community table -> play it there, face up, where it landed
        const x = Math.min(0.97, Math.max(0.03, (px - tr.left) / tr.width));
        const y = Math.min(0.94, Math.max(0.06, (py - tr.top) / tr.height));
        const i = state.myHand.indexOf(code); if (i >= 0) state.myHand.splice(i, 1); // optimistic
        emit("playFromHand", { code, faceUp: true, x, y });
      } else {
        // released within the hand -> reorder to the drop position
        const cards = Array.from(container.querySelectorAll(".handcard"));
        let idx = 0;
        for (const k of cards) { if (k === el) continue; const r = k.getBoundingClientRect(); if (px > r.left + r.width / 2) idx++; }
        const order = state.myHand.slice();
        const from = order.indexOf(code);
        if (from >= 0) { order.splice(from, 1); order.splice(idx, 0, code); }
        state.myHand = order; // optimistic
        emit("reorderHand", { order });
      }
      dragging = false; render();
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  }

  /* ---------------- poker mode UI ---------------- */
  function pokerCenter(pk) {
    if (pk.results) {
      const r = pk.results;
      const win = r.winners.map((w) => esc(w.name) + " +" + w.amount + (w.hand ? " (" + w.hand + ")" : "")).join(", ");
      const shown = (r.shown || []).filter(s => s.hand).map((s) => esc(s.name) + ": " + s.hand).join(" \u00b7 ");
      return `<div class="pcenter"><div class="result">\uD83C\uDFC6 ${win}</div>${shown ? `<div class="showns">${shown}</div>` : ""}${pk.canStart ? '<button class="btn primary" id="deal">Deal next hand</button>' : '<div class="hint">Need 2+ players with chips</div>'}</div>`;
    }
    if (!pk.handLive) return `<div class="pcenter">${pk.canStart ? '<button class="btn primary" id="deal">Deal hand</button>' : '<div class="hint">Add chips, then deal \u2014 needs 2+ players</div>'}</div>`;
    const turn = (pk.players.find((p) => p.isTurn) || {}).name;
    return `<div class="pcenter"><div class="hint">${turn ? esc(turn) + " to act\u2026" : ""}</div></div>`;
  }
  function actionBar(pk) {
    const add = '<button class="pbtn add" id="addchips">\uFF0B Add chips</button>';
    if (pk.myTurn && pk.legal) {
      const L = pk.legal;
      if (raiseTo < L.minRaiseTo) raiseTo = L.minRaiseTo;
      if (raiseTo > L.maxRaiseTo) raiseTo = L.maxRaiseTo;
      const callLabel = L.canCheck ? "Check" : (L.canCall ? "Call " + L.toCall : "Call");
      const canRaise = L.canRaise && L.maxRaiseTo >= L.minRaiseTo;
      return `<div class="actionbar">
        <button class="pbtn fold" id="fold">Fold</button>
        <button class="pbtn call" id="callcheck">${callLabel}</button>
        ${canRaise ? `<div class="raisebox"><button class="pbtn step" id="rminus">\u2212</button><span class="ramt">${raiseTo}</span><button class="pbtn step" id="rplus">\uFF0B</button><button class="pbtn raise" id="raise">Raise</button></div>` : ""}
        <button class="pbtn allin" id="allin">All-in</button>
      </div>${add}`;
    }
    return `<div class="actionbar idle">${pk.handLive ? '<span class="hint">Waiting\u2026</span>' : ""}${add}</div>`;
  }
  function renderPoker() {
    const pk = state.poker;
    app.innerHTML = `
    <div class="table">
      <header class="top">
        <div class="codebox" id="codebox"><span class="codelabel">TABLE CODE</span><span class="codeval">${esc(state.code)}</span><span class="copy">tap to copy</span></div>
        <button class="iconbtn" id="menu">\u22EF</button>
      </header>
      <div class="players pokerplayers">
        ${pk.players.map((p) => {
          const badges = (p.isButton ? '<span class="badge btn">D</span>' : "") + (p.isSB ? '<span class="badge">SB</span>' : "") + (p.isBB ? '<span class="badge">BB</span>' : "");
          const status = p.folded ? "folded" : (p.allIn ? "all-in" : (p.away ? "away" : ""));
          return `<div class="pseat${p.isTurn ? " turn" : ""}${p.folded ? " folded" : ""}">
            <div class="pseat-top">${badges}<span class="pn">${esc(p.name)}${p.me ? " (you)" : ""}</span></div>
            <div class="pchips">\uD83E\uDE99 ${p.chips}</div>
            ${p.cRound ? `<div class="pbet">bet ${p.cRound}</div>` : ""}
            ${status ? `<div class="pstatus">${status}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
      <div class="felt pokerfelt">
        <div class="pokerinfo">${pk.handLive ? `<b>${pk.phase.toUpperCase()}</b> \u00b7 Pot ${pk.pot} \u00b7 Blinds ${pk.sb}/${pk.bb}` : `Blinds ${pk.sb}/${pk.bb}`}</div>
        <div class="board">
          ${(pk.community || []).map((c) => `<div class="bcard">${cardInner(c, true)}</div>`).join("")}
          ${pk.handLive ? Array(Math.max(0, 5 - (pk.community || []).length)).fill('<div class="bslot"></div>').join("") : ""}
        </div>
        ${pokerCenter(pk)}
      </div>
      <div class="hand pokerhand">
        ${pk.myHole ? `<div class="holecards">${pk.myHole.map((c) => `<div class="holecard">${cardInner(c, true)}</div>`).join("")}${pk.myFolded ? '<span class="foldedtag">folded</span>' : ""}</div>` : '<div class="holecards"><span class="emptyhand">Not in this hand</span></div>'}
        ${actionBar(pk)}
      </div>
    </div>`;

    const step = pk.bb || 10;
    const $ = (id) => document.getElementById(id);
    $("codebox").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(state.code); toast("Code copied"); };
    $("menu").onclick = () => { sheet = { kind: "pmenu" }; renderSheet(); };
    if ($("deal")) $("deal").onclick = () => emit("pokerStart");
    if ($("addchips")) $("addchips").onclick = () => { sheet = { kind: "addchips" }; renderSheet(); };
    if ($("fold")) $("fold").onclick = () => emit("pokerAction", { action: "fold" });
    if ($("callcheck")) $("callcheck").onclick = () => emit("pokerAction", { action: pk.legal.canCheck ? "check" : "call" });
    if ($("allin")) $("allin").onclick = () => emit("pokerAction", { action: "allin" });
    if ($("raise")) $("raise").onclick = () => emit("pokerAction", { action: "raise", amount: raiseTo });
    if ($("rminus")) $("rminus").onclick = () => { raiseTo = Math.max(pk.legal.minRaiseTo, raiseTo - step); renderPoker(); };
    if ($("rplus")) $("rplus").onclick = () => { raiseTo = Math.min(pk.legal.maxRaiseTo, raiseTo + step); renderPoker(); };
  }

  function renderSheet() {
    let body = "";
    const T = (t) => `<h3 class="sheettitle">${t}</h3>`;
    const R = (act, label, danger) => `<button class="row${danger ? " danger" : ""}" data-row="${act}">${label}</button>`;
    if (sheet.kind === "deck") {
      const others = state.players.filter((p) => !p.me);
      body = T("Deck \u00b7 " + state.deckCount + " cards")
        + R("shuffle", "\uD83D\uDD00 Shuffle deck")
        + R("dealMe", "\u2935\uFE0F Deal a card to my hand")
        + R("dealTable", "\uD83C\uDFB4 Deal a card to the table (face down)")
        + others.map((p) => R("dealTo:" + p.id, "\u27A1\uFE0F Deal a card to " + esc(p.name))).join("")
        + (others.length ? R("dealRound", "\uD83C\uDCCF Deal one card to everyone") : "")
        + (state.players.length ? R("dealMulti", "\uD83D\uDD22 Deal several cards to a player\u2026") : "");
    } else if (sheet.kind === "dealN") {
      const counts = [1, 2, 3, 4, 5, 7];
      body = T("Deal how many, to whom?")
        + '<div class="countrow">' + counts.map((nn) => `<button class="countbtn${nn === dealN ? " on" : ""}" data-row="setN:${nn}">${nn}</button>`).join("") + '</div>'
        + state.players.map((p) => R("dealNto:" + p.id, "\u27A1\uFE0F Deal " + dealN + " to " + esc(p.name) + (p.me ? " (me)" : ""))).join("");
    }
    else if (sheet.kind === "table") { const c = sheet.card; body = T("Table card") + R("flip", c.faceUp ? "\uD83D\uDD3D Turn face down" : "\uD83D\uDD3C Turn face up (everyone sees it)") + (!c.faceUp ? R("peek", c.peekedByMe ? "\uD83D\uDE48 Stop peeking" : "\uD83D\uDC41 Peek privately") : "") + R("take", "\u270B Take into my hand") + R("toDeck", "\u21A9\uFE0F Return to deck"); }
    else if (sheet.kind === "hand") body = T("Your card") + R("playUp", "\uD83C\uDFB4 Play to table, face up") + R("playDown", "\uD83C\uDCA0 Play to table, face down") + R("handDeck", "\u21A9\uFE0F Return to deck");
    else if (sheet.kind === "player") { const p = state.players.find((x) => x.id === sheet.pid); body = T(esc(p ? p.name : "")) + R("dealPlayer", "\u2935\uFE0F Deal a card to " + esc(p ? p.name : "")); }
    else if (sheet.kind === "menu") body = T("Table options") + R("shuffle", "\uD83D\uDD00 Shuffle deck") + R("collect", "\u267B\uFE0F Collect all cards & reshuffle") + R("pokerOn", "\u2660 Start poker mode") + R("leave", "\uD83D\uDEAA Leave table", true);
    else if (sheet.kind === "pmenu") body = T("Poker table") + R("addchips:100", "\uD83E\uDE99 Add 100 chips") + R("addchips:500", "\uD83E\uDE99 Add 500 chips") + R("addchips:1000", "\uD83E\uDE99 Add 1000 chips") + R("pokerOff", "\u2660 Turn off poker mode") + R("leave", "\uD83D\uDEAA Leave table", true);
    else if (sheet.kind === "addchips") body = T("Add chips to your stack") + R("addchips:100", "\uD83E\uDE99 100") + R("addchips:500", "\uD83E\uDE99 500") + R("addchips:1000", "\uD83E\uDE99 1000");

    let scrim = document.getElementById("scrim");
    if (!scrim) { scrim = document.createElement("div"); scrim.id = "scrim"; scrim.className = "scrim"; document.body.appendChild(scrim); }
    scrim.innerHTML = `<div class="sheet" id="sheetinner">${body}</div>`;
    scrim.onclick = (e) => { if (e.target === scrim) closeSheet(); };
    scrim.querySelectorAll("[data-row]").forEach((el) => (el.onclick = () => handleRow(el.dataset.row)));
  }
  function closeSheet() { sheet = null; const s = document.getElementById("scrim"); if (s) s.remove(); }

  function handleRow(act) {
    const c = sheet.card, code = sheet.code, pid = sheet.pid;
    if (act.indexOf("dealTo:") === 0) { emit("dealToPlayer", { pid: act.slice(7) }); closeSheet(); render(); return; }
    if (act.indexOf("setN:") === 0) { dealN = parseInt(act.slice(5)) || 1; renderSheet(); return; }
    if (act.indexOf("dealNto:") === 0) { emit("dealMany", { pid: act.slice(8), n: dealN }); closeSheet(); render(); return; }
    if (act === "dealMulti") { sheet = { kind: "dealN" }; renderSheet(); return; }
    if (act.indexOf("addchips:") === 0) { emit("pokerAddChips", { amount: parseInt(act.slice(9)) || 100 }); closeSheet(); render(); return; }
    const map = {
      shuffle: () => { emit("shuffle"); shuf = true; },
      dealMe: () => emit("dealToMe"),
      dealTable: () => emit("dealToTable"),
      dealPlayer: () => emit("dealToPlayer", { pid }),
      dealRound: () => emit("dealRound"),
      pokerOn: () => emit("pokerOn"),
      pokerOff: () => emit("pokerOff"),
      flip: () => emit("flip", { id: c.id }),
      peek: () => emit("peek", { id: c.id }),
      take: () => emit("takeFromTable", { id: c.id }),
      toDeck: () => emit("tableToDeck", { id: c.id }),
      playUp: () => emit("playFromHand", { code, faceUp: true }),
      playDown: () => emit("playFromHand", { code, faceUp: false }),
      handDeck: () => emit("handToDeck", { code }),
      collect: () => { emit("collectAll"); shuf = true; },
      leave: () => { emit("leave"); me = null; saveMe(); state = null; },
    };
    (map[act] || (() => {}))();
    closeSheet();
    render();
  }

  let toastT;
  function toast(m) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 1800);
  }

  window.addEventListener("resize", () => { if (me && state && !dragging) layoutHand(); });
  render();
})();
</script></body></html>
